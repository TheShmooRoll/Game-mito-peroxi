    drawLimb(c, x1, y1, x2, y2, width, color, armor) {
      c.save();
      c.strokeStyle = '#11131b';
      c.lineWidth = width + 9;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      c.strokeStyle = color;
      c.lineWidth = width;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      c.strokeStyle = armor;
      c.lineWidth = Math.max(5, width * 0.42);
      c.beginPath(); c.moveTo(lerp(x1, x2, 0.45), lerp(y1, y2, 0.45)); c.lineTo(lerp(x1, x2, 0.85), lerp(y1, y2, 0.85)); c.stroke();
      c.restore();
    }

    drawArm(c, x1, y1, x2, y2, rot, color, armor, scale = 1) {
      c.save();
      c.translate(x1, y1);
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx) + rot;
      c.rotate(angle);
      c.strokeStyle = '#131219';
      c.lineWidth = 28 * scale;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(len, 0); c.stroke();
      c.strokeStyle = color;
      c.lineWidth = 20 * scale;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(len, 0); c.stroke();
      c.strokeStyle = armor;
      c.lineWidth = 10 * scale;
      c.beginPath(); c.moveTo(len * 0.45, 0); c.lineTo(len * 0.82, 0); c.stroke();
      c.fillStyle = armor;
      c.strokeStyle = '#08090e';
      c.lineWidth = 5;
      c.beginPath();
      c.ellipse(len + 9 * scale, 0, 18 * scale, 16 * scale, 0, 0, TAU);
      c.fill(); c.stroke();
      c.restore();
    }

    drawBoot(c, x, y, rot, base, accent, scale = 1) {
      c.save();
      c.translate(x, y);
      c.rotate(rot);
      c.scale(scale, scale);
      c.fillStyle = base;
      c.strokeStyle = '#0b0b10';
      c.lineWidth = 6;
      roundedRectPath(c, -24, -16, 53, 32, 11);
      c.fill(); c.stroke();
      c.fillStyle = accent;
      c.fillRect(-17, 7, 39, 5);
      c.restore();
    }

    drawEnemy(c, enemy) {
      c.save();
      c.globalAlpha = enemy.dead ? clamp(1 - (enemy.removeTimer ?? 0) / 0.75, 0, 1) : 1;
      if (enemy.kind === 'mitotoxin') this.drawMitotoxin(c, enemy);
      else if (enemy.kind.startsWith('aggregate')) this.drawAggregate(c, enemy);
      else if (enemy.kind === 'pore-former') this.drawPoreFormer(c, enemy);
      c.restore();
    }

    drawMitotoxin(c, e) {
      const bob = Math.sin(e.animTime * 10) * 5;
      const face = e.facing || -1;
      const attackStretch = e.attack?.kind === 'latch' ? easeInOut(clamp(e.attack.time / e.attack.duration, 0, 1)) : 0;
      c.save();
      c.translate(e.x, e.y - 45 + bob);
      c.scale(face, 1);
      c.rotate(e.vx * 0.0005);

      // Shadow on ground.
      c.save();
      c.scale(face, 1);
      c.globalAlpha = 0.28;
      c.fillStyle = '#000';
      c.beginPath(); c.ellipse(0, 48 - bob, 32, 10, 0, 0, TAU); c.fill();
      c.restore();

      // Protein ribbon loops.
      const ribbonColor = e.flash > 0 ? '#ffffff' : '#7e35c9';
      c.shadowColor = '#bb49ff';
      c.shadowBlur = 18;
      c.strokeStyle = ribbonColor;
      c.lineWidth = 12;
      for (let i = 0; i < 5; i++) {
        c.beginPath();
        const phase = i * 1.35 + e.animTime * 0.5;
        c.ellipse(Math.cos(phase) * 8, Math.sin(phase) * 6, 34 - i * 2, 15 + i * 2, phase * 0.5, 0, TAU);
        c.stroke();
      }
      c.shadowBlur = 0;

      // Core and eye.
      const g = c.createRadialGradient(-5, -5, 2, 0, 0, 32);
      g.addColorStop(0, '#bd66ff');
      g.addColorStop(0.45, '#3b1d68');
      g.addColorStop(1, '#10132b');
      c.fillStyle = g;
      c.strokeStyle = '#161226';
      c.lineWidth = 5;
      c.beginPath(); c.ellipse(0, 0, 30, 24, 0, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#f6e7ff';
      c.beginPath(); c.ellipse(5, -3, 15, 9, -0.25, 0, TAU); c.fill();
      c.fillStyle = '#6c0c88';
      c.beginPath(); c.arc(10, -3, 6, 0, TAU); c.fill();

      // Piercing limbs.
      c.strokeStyle = '#15263a';
      c.lineWidth = 8;
      c.fillStyle = '#54e9ff';
      for (let i = 0; i < 4; i++) {
        const side = i < 2 ? -1 : 1;
        const yy = (i % 2) * 20 - 13;
        const reach = 43 + attackStretch * (i >= 2 ? 45 : 15);
        c.beginPath();
        c.moveTo(side * 22, yy);
        c.lineTo(side * reach, yy + (i % 2 ? 16 : -12));
        c.stroke();
        c.beginPath();
        c.moveTo(side * reach, yy + (i % 2 ? 16 : -12));
        c.lineTo(side * (reach + 18), yy + (i % 2 ? 8 : -19));
        c.lineTo(side * (reach + 4), yy + (i % 2 ? 27 : -3));
        c.closePath();
        c.fill();
      }
      c.restore();
    }

    drawAggregate(c, e) {
      const scale = e.kind === 'aggregate-small' ? 0.55 : e.kind === 'aggregate-medium' ? 1 : 1.62;
      const bob = Math.sin(e.animTime * (e.kind === 'aggregate-small' ? 8 : 4)) * 4;
      const attackT = e.attack ? e.attack.time / e.attack.duration : 0;
      const smash = e.attack?.kind === 'smash' ? Math.sin(clamp(attackT, 0, 1) * Math.PI) : 0;

      c.save();
      c.translate(e.x, e.y - e.radius * 0.55 + bob);
      c.scale(e.facing || -1, 1);
      c.scale(scale, scale);

      c.save();
      c.scale(e.facing || -1, 1);
      c.globalAlpha = 0.32;
      c.fillStyle = '#000';
      c.beginPath(); c.ellipse(0, e.radius / scale * 0.65 - bob, 70, 18, 0, 0, TAU); c.fill();
      c.restore();

      const seed = e.id * 0.71;
      const blobs = e.kind === 'aggregate-fused' ? 18 : 12;
      for (let i = 0; i < blobs; i++) {
        const a = i * 2.399 + seed;
        const rr = (i % 4) * 11;
        const bx = Math.cos(a) * rr + (i % 3 - 1) * 5;
        const by = Math.sin(a) * rr * 0.72 + (i % 2 ? 5 : -5);
        const br = 20 + (i % 4) * 5;
        const grad = c.createRadialGradient(bx - 6, by - 7, 2, bx, by, br);
        grad.addColorStop(0, e.flash > 0 ? '#ffffff' : '#604050');
        grad.addColorStop(0.55, '#2c1c32');
        grad.addColorStop(1, '#110f19');
        c.fillStyle = grad;
        c.strokeStyle = '#090912';
        c.lineWidth = 4;
        c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill(); c.stroke();
      }

      // Fibrils.
      c.strokeStyle = '#dc3db3';
      c.shadowColor = '#ff46d0';
      c.shadowBlur = 15;
      c.lineWidth = e.kind === 'aggregate-fused' ? 10 : 7;
      for (let i = 0; i < (e.kind === 'aggregate-fused' ? 8 : 5); i++) {
        const a = i * TAU / (e.kind === 'aggregate-fused' ? 8 : 5) + seed;
        const r = 42 + (i % 3) * 7;
        c.beginPath();
        c.moveTo(Math.cos(a) * 20, Math.sin(a) * 15);
        c.bezierCurveTo(Math.cos(a + 0.6) * r, Math.sin(a + 0.6) * r * 0.7,
          Math.cos(a - 0.45) * r * 1.35, Math.sin(a - 0.45) * r,
          Math.cos(a) * r * 1.45, Math.sin(a) * r);
        c.stroke();
      }
      c.shadowBlur = 0;

      // Eye/core.
      c.shadowColor = '#ff4bd1';
      c.shadowBlur = 22;
      c.fillStyle = '#ff73de';
      c.beginPath(); c.ellipse(10, -5, 22, 11, -0.25, 0, TAU); c.fill();
      c.fillStyle = '#5a0b58';
      c.beginPath(); c.arc(16, -5, 7, 0, TAU); c.fill();
      c.shadowBlur = 0;

      // Larger forms have fists/arms.
      if (e.kind !== 'aggregate-small') {
        const arm = 63 + smash * 70;
        this.drawArm(c, 35, 10, arm, 42, 0.1, '#38243a', '#18131d', e.kind === 'aggregate-fused' ? 1.25 : 0.95);
        this.drawArm(c, -33, 6, -59, 38, -0.1, '#38243a', '#18131d', e.kind === 'aggregate-fused' ? 1.18 : 0.9);
      }
      c.restore();

      // Health bar for medium/fused.
      if (!e.dead && e.kind !== 'aggregate-small') {
        const w = e.kind === 'aggregate-fused' ? 180 : 120;
        this.drawWorldHealthBar(c, e.x, e.y - e.radius * 1.55, w, e.health / e.maxHealth, '#ff4bc3');
      }
    }

    drawPoreFormer(c, e) {
      const attackT = e.attack ? e.attack.time / e.attack.duration : 0;
      const spin = e.attack?.kind === 'blade-spin' ? attackT * TAU * 2.5 : e.animTime * 0.35;
      const pulse = 0.94 + Math.sin(e.animTime * 3.8) * 0.06;
      c.save();
      c.translate(e.x, e.y - 78);
      c.scale(e.facing || -1, 1);
      c.scale(pulse, pulse);
      c.rotate(spin);

      c.save();
      c.scale(e.facing || -1, 1);
      c.globalAlpha = 0.34;
      c.fillStyle = '#000';
      c.beginPath(); c.ellipse(0, 92, 120, 25, 0, 0, TAU); c.fill();
      c.restore();

      // Oligomer ring.
      for (let i = 0; i < 9; i++) {
        const a = i * TAU / 9;
        c.save();
        c.rotate(a);
        c.translate(72, 0);
        c.rotate(-a * 0.25);
        const g = c.createLinearGradient(-24, -20, 30, 24);
        g.addColorStop(0, e.flash > 0 ? '#ffffff' : '#7568d9');
        g.addColorStop(0.55, '#3c357e');
        g.addColorStop(1, '#141b34');
        c.fillStyle = g;
        c.strokeStyle = '#0d1022';
        c.lineWidth = 6;
        c.beginPath();
        c.ellipse(0, 0, 34, 24, 0, 0, TAU);
        c.fill(); c.stroke();
        c.fillStyle = '#69eaff';
        c.shadowColor = '#5ee7ff';
        c.shadowBlur = 14;
        c.beginPath(); c.arc(7, -2, 7, 0, TAU); c.fill();
        c.shadowBlur = 0;
        // Blade.
        c.fillStyle = '#4ee7ff';
        c.beginPath();
        c.moveTo(24, -6);
        c.lineTo(85, 0);
        c.lineTo(26, 9);
        c.closePath();
        c.fill();
        c.restore();
      }

      // Breach core.
      const rg = c.createRadialGradient(-8, -10, 4, 0, 0, 55);
      rg.addColorStop(0, '#ecfaff');
      rg.addColorStop(0.28, '#62eaff');
      rg.addColorStop(0.58, '#733cff');
      rg.addColorStop(1, 'rgba(12,9,35,0)');
      c.fillStyle = rg;
      c.shadowColor = '#67ddff';
      c.shadowBlur = 28;
      c.beginPath(); c.arc(0, 0, 58, 0, TAU); c.fill();
      c.shadowBlur = 0;

      // Eye slit inside core.
      c.fillStyle = '#f6feff';
      c.beginPath(); c.ellipse(5, -4, 24, 8, -0.2, 0, TAU); c.fill();
      c.fillStyle = '#132050';
      c.beginPath(); c.arc(12, -4, 6, 0, TAU); c.fill();

      if (e.attack?.kind === 'pore-burst') {
        const r = easeOutCubic(clamp(attackT, 0, 1)) * 175;
        c.strokeStyle = '#a86dff';
        c.lineWidth = 8;
        c.shadowColor = '#6ee8ff';
        c.shadowBlur = 25;
        c.globalAlpha = 1 - attackT * 0.6;
        c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
      }
      c.restore();
    }

    drawWorldHealthBar(c, x, y, w, ratio, color) {
      roundedRectPath(c, x - w / 2, y, w, 11, 5);
      c.fillStyle = 'rgba(5,5,12,.80)';
      c.fill();
      roundedRectPath(c, x - w / 2 + 2, y + 2, (w - 4) * clamp(ratio, 0, 1), 7, 3);
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 10;
      c.fill();
      c.shadowBlur = 0;
    }

    drawHUD(c) {
      if (!this.player) return;
      this.drawHeroHUD(c, this.player, 34, 26, false);
      this.drawHeroHUD(c, this.partner, W - 34, 26, true);

      // Stage label.
      c.save();
      c.textAlign = 'center';
      c.font = '1000 italic 31px system-ui, sans-serif';
      c.fillStyle = '#f8f6ff';
      c.shadowColor = '#678cff';
      c.shadowBlur = 14;
      c.fillText('CELL BRAWLERS', W / 2, 44);
      c.shadowBlur = 0;
      c.font = '800 13px system-ui, sans-serif';
      c.fillStyle = '#aeb8d2';
      const stage = !this.wave0Clear ? 'STAGE 1-1  •  CYTOSKELETON HIGHWAY'
        : !this.wave1Clear ? 'STAGE 1-2  •  PROTEIN SPILL'
          : 'STAGE 1-3  •  CONTACT ZONE';
      c.fillText(stage, W / 2, 68);
      c.restore();

      // Score and combo.
      c.save();
      c.textAlign = 'left';
      c.font = '900 20px system-ui, sans-serif';
      c.fillStyle = '#ffe578';
      c.fillText(`SCORE ${String(this.score).padStart(6, '0')}`, 36, 152);
      if (this.combo > 1) {
        c.font = '1000 italic 46px system-ui, sans-serif';
        c.fillStyle = '#fff08e';
        c.shadowColor = '#ff713f';
        c.shadowBlur = 16;
        c.fillText(`${this.combo} HIT COMBO!`, 38, 205);
      }
      c.restore();

      // Boss bar.
      const boss = this.enemies.find(e => e.boss && !e.dead);
      if (boss) {
        const x = W / 2 - 250;
        const y = 92;
        c.textAlign = 'center';
        c.font = '900 16px system-ui, sans-serif';
        c.fillStyle = '#cdefff';
        c.fillText('PORE FORMER', W / 2, y);
        roundedRectPath(c, x, y + 12, 500, 18, 7);
        c.fillStyle = 'rgba(5,8,18,.9)'; c.fill();
        roundedRectPath(c, x + 3, y + 15, 494 * (boss.health / boss.maxHealth), 12, 5);
        const g = c.createLinearGradient(x, 0, x + 500, 0);
        g.addColorStop(0, '#6ee9ff');
        g.addColorStop(1, '#a959ff');
        c.fillStyle = g; c.fill();
      }

      // Fusion warning.
      if (this.fusionWarning) {
        const pulse = 0.65 + Math.sin(this.time * 10) * 0.25;
        const x = W - 365;
        const y = 174;
        roundedRectPath(c, x, y, 330, 67, 10);
        c.fillStyle = `rgba(43,5,31,${0.78 + pulse * 0.12})`;
        c.fill();
        c.strokeStyle = `rgba(255,67,191,${pulse + 0.1})`;
        c.lineWidth = 3;
        c.stroke();
        c.font = '1000 19px system-ui, sans-serif';
        c.textAlign = 'left';
        c.fillStyle = '#ff63cf';
        c.fillText('⚠  AGGREGATE FUSION', x + 18, y + 27);
        c.font = '700 13px system-ui, sans-serif';
        c.fillStyle = '#e8bddc';
        c.fillText('INTERRUPT OR SEPARATE THE CLUMPS', x + 18, y + 50);
      }

      // Center announcements.
      if (this.messageTimer > 0) {
        const a = clamp(this.messageTimer / 0.25, 0, 1);
        c.save();
        c.globalAlpha = a;
        c.textAlign = 'center';
        c.font = '1000 italic 30px system-ui, sans-serif';
        c.lineWidth = 9;
        c.strokeStyle = 'rgba(4,5,14,.9)';
        c.strokeText(this.message, W / 2, 275);
        c.fillStyle = this.messageColor;
        c.shadowColor = this.messageColor;
        c.shadowBlur = 18;
        c.fillText(this.message, W / 2, 275);
        c.restore();
      }

      // Early controls card.
      if (this.helpTimer > 0) {
        const a = clamp(this.helpTimer < 1 ? this.helpTimer : 1, 0, 1);
        c.save();
        c.globalAlpha = a * 0.93;
        roundedRectPath(c, W / 2 - 310, H - 99, 620, 72, 16);
        c.fillStyle = 'rgba(4,7,18,.86)';
        c.fill();
        c.strokeStyle = 'rgba(152,204,255,.24)';
        c.stroke();
        c.textAlign = 'center';
        c.font = '800 17px system-ui, sans-serif';
        c.fillStyle = '#edf2ff';
        c.fillText('MOVE  WASD / ARROWS     LIGHT  J     HEAVY  K     SPECIAL  L     DASH  SPACE', W / 2, H - 66);
        c.font = '600 13px system-ui, sans-serif';
        c.fillStyle = '#aab5d0';
        c.fillText('Mitochondrion: heavy attack shakes off attached toxins.  Peroxisome: attacks cleanse them.', W / 2, H - 42);
        c.restore();
      }
    }

    drawHeroHUD(c, hero, anchorX, y, rightAligned) {
      const panelW = 450;
      const x = rightAligned ? anchorX - panelW : anchorX;
      roundedRectPath(c, x, y, panelW, 103, 15);
      c.fillStyle = 'rgba(5,7,17,.84)';
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,.10)';
      c.stroke();

      const portraitX = rightAligned ? x + panelW - 58 : x + 58;
      c.save();
      c.translate(portraitX, y + 53);
      c.scale(0.32, 0.32);
      if (hero.type === 'mito') this.drawMito(c, { ...hero, x: 0, y: 62, attack: null, attached: [] }, false);
      else this.drawPeroxi(c, { ...hero, x: 0, y: 49, attack: null, attached: [] }, false);
      c.restore();

      const tx = rightAligned ? x + 18 : x + 112;
      c.textAlign = rightAligned ? 'right' : 'left';
      const textX = rightAligned ? x + panelW - 112 : tx;
      c.font = '1000 italic 23px system-ui, sans-serif';
      c.fillStyle = hero.type === 'mito' ? '#ff9c43' : '#66ffa5';
      c.fillText(`${hero.controlled ? 'P1 ' : 'AI '}${hero.name}`, textX, y + 30);

      const barX = rightAligned ? x + 20 : x + 112;
      const barW = 318;
      this.drawHudBar(c, barX, y + 43, barW, 16, hero.health / hero.maxHealth, hero.dead ? '#5a5965' : (hero.type === 'mito' ? '#ff4b55' : '#67ed83'), 'HP');
      this.drawHudBar(c, barX, y + 71, barW, 13, hero.energy / hero.maxEnergy, hero.type === 'mito' ? '#ffb743' : '#54dfff', 'ENERGY');

      if (hero.dead) {
        c.textAlign = 'center';
        c.font = '1000 16px system-ui, sans-serif';
        c.fillStyle = '#ff7697';
        c.fillText('DOWN — PARTNER CAN REVIVE', x + panelW / 2, y + 98);
      }
    }

    drawHudBar(c, x, y, w, h, ratio, color, label) {
      c.font = '900 11px system-ui, sans-serif';
      c.textAlign = 'left';
      c.fillStyle = '#cbd2e5';
      c.fillText(label, x, y - 4);
      roundedRectPath(c, x + 52, y - 14, w - 52, h, 5);
      c.fillStyle = 'rgba(255,255,255,.08)'; c.fill();
      roundedRectPath(c, x + 54, y - 12, Math.max(0, (w - 56) * clamp(ratio, 0, 1)), h - 4, 4);
      c.fillStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 10;
      c.fill();
      c.shadowBlur = 0;
    }

    drawPause(c) {
      c.fillStyle = 'rgba(3,4,11,.72)';
      c.fillRect(0, 0, W, H);
      c.textAlign = 'center';
      c.font = '1000 italic 70px system-ui, sans-serif';
      c.fillStyle = '#ffffff';
      c.fillText('PAUSED', W / 2, H / 2 - 30);
      c.font = '700 22px system-ui, sans-serif';
      c.fillStyle = '#bcc6de';
      c.fillText('Press P or Escape to continue', W / 2, H / 2 + 25);
    }

    drawEndScreen(c, victory) {
      c.fillStyle = victory ? 'rgba(4,20,19,.78)' : 'rgba(28,4,15,.78)';
      c.fillRect(0, 0, W, H);
      c.textAlign = 'center';
      c.font = '1000 italic 76px system-ui, sans-serif';
      c.fillStyle = victory ? '#8effc1' : '#ff6d91';
      c.shadowColor = c.fillStyle;
      c.shadowBlur = 24;
      c.fillText(victory ? 'BREACH CONTAINED' : 'CELLULAR FAILURE', W / 2, 315);
      c.shadowBlur = 0;
      c.font = '800 25px system-ui, sans-serif';
      c.fillStyle = '#f0f3ff';
      c.fillText(victory ? 'Mitochondrion and Peroxisome held the contact zone.' : 'Both organelles were overwhelmed.', W / 2, 365);

      roundedRectPath(c, W / 2 - 250, 415, 500, 140, 18);
      c.fillStyle = 'rgba(4,7,16,.72)'; c.fill();
      c.strokeStyle = 'rgba(255,255,255,.14)'; c.stroke();
      c.font = '900 23px system-ui, sans-serif';
      c.fillStyle = '#ffe783';
      c.fillText(`SCORE  ${String(this.score).padStart(6, '0')}`, W / 2, 462);
      c.fillStyle = '#dce3f6';
      c.fillText(`BEST COMBO  ${this.maxCombo}`, W / 2, 505);
      c.font = '700 19px system-ui, sans-serif';
      c.fillStyle = '#b8c3dc';
      c.fillText('Press Enter, Space, or R to return to character select', W / 2, 616);
    }
  }

  const game = new Game();
  window.cellBrawlers = game;

  let last = performance.now();
  function loop(now) {
    const rawDt = Math.min(0.034, Math.max(0, (now - last) / 1000));
    last = now;

    if (game.hitStop > 0 && game.state === 'playing') {
      game.hitStop -= rawDt;
      game.updateEffects(rawDt * 0.25);
    } else {
      game.update(rawDt);
    }

    game.render();
    game.input.endFrame();
    requestAnimationFrame(loop);
  }

  const finishLoading = () => {
    loading.classList.add('hidden');
    setTimeout(() => { loading.style.display = 'none'; }, 260);
    canvas.focus();
  };
  if (game.titleImage.complete) finishLoading();
  else {
    game.titleImage.addEventListener('load', finishLoading, { once: true });
    game.titleImage.addEventListener('error', finishLoading, { once: true });
    setTimeout(finishLoading, 1800);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
