<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070816" />
<title>Cell Brawlers — Playable Prototype</title>
<style>:root {
  color-scheme: dark;
  --ink: #070816;
  --panel: rgba(8, 10, 25, 0.85);
  --line: rgba(153, 188, 255, 0.24);
  --text: #f7f8ff;
  --muted: #b7bfd8;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 20%, #222048 0, transparent 34%),
    radial-gradient(circle at 80% 70%, #251135 0, transparent 36%),
    var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  display: grid;
  place-items: center;
}

#game-shell {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  background: #050713;
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.75);
  overflow: hidden;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  image-rendering: auto;
  touch-action: none;
}

#loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #070816;
  transition: opacity 220ms ease;
  pointer-events: none;
}

#loading.hidden {
  opacity: 0;
}

.loading-card {
  width: min(420px, 70vw);
  text-align: center;
}

.loading-title {
  font-weight: 1000;
  letter-spacing: 0.12em;
  font-style: italic;
  font-size: clamp(26px, 6vw, 54px);
  background: linear-gradient(90deg, #ff8a36, #f7f2ff 45%, #64e8ff);
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 24px rgba(74, 180, 255, 0.35));
}

.loading-line {
  display: block;
  height: 5px;
  margin: 18px 0 12px;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
}

.loading-line span {
  display: block;
  width: 40%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #ff6b31, #b74cff, #4ee5ff);
  animation: load 1.1s ease-in-out infinite alternate;
}

.loading-card p {
  color: var(--muted);
  margin: 0;
}

@keyframes load {
  from { transform: translateX(-20%); }
  to   { transform: translateX(170%); }
}

#help {
  position: fixed;
  left: 12px;
  bottom: 10px;
  z-index: 20;
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  max-width: calc(100vw - 24px);
  padding: 7px 10px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px;
  background: rgba(4, 6, 15, .72);
  backdrop-filter: blur(8px);
  color: #c6cbe0;
  font-size: 11px;
  pointer-events: none;
}

#help strong { color: white; }

#touch-controls {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.touch-pad {
  position: absolute;
  bottom: max(16px, env(safe-area-inset-bottom));
  pointer-events: auto;
}

.touch-pad button {
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(6, 8, 20, .62);
  color: white;
  box-shadow: inset 0 0 22px rgba(107, 140, 255, .12), 0 5px 20px rgba(0,0,0,.25);
  backdrop-filter: blur(7px);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.movement {
  left: max(16px, env(safe-area-inset-left));
  width: 154px;
  height: 154px;
}

.movement button {
  position: absolute;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  font-size: 18px;
}

.movement [data-key="ArrowLeft"]  { left: 0; top: 51px; }
.movement [data-key="ArrowRight"] { right: 0; top: 51px; }
.movement [data-key="ArrowUp"]    { left: 51px; top: 0; }
.movement [data-key="ArrowDown"]  { left: 51px; bottom: 0; }

.actions {
  right: max(16px, env(safe-area-inset-right));
  width: 184px;
  height: 154px;
}

.actions button {
  position: absolute;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 900;
}

.actions .light { right: 58px; bottom: 0; border-color: rgba(88,230,255,.4); }
.actions .heavy { right: 0; bottom: 52px; border-color: rgba(255,128,60,.42); }
.actions .special { right: 58px; top: 0; border-color: rgba(110,255,132,.42); }
.actions .dash { left: 0; bottom: 35px; border-color: rgba(192,110,255,.4); }

@media (pointer: coarse), (max-width: 900px) {
  #touch-controls { display: block; }
  #help { display: none; }
}

@media (max-height: 500px) {
  .movement { transform: scale(.78); transform-origin: left bottom; }
  .actions { transform: scale(.78); transform-origin: right bottom; }
}
</style>
</head>
<body>
<main id="game-shell" aria-label="Cell Brawlers playable prototype">
  <canvas id="game" width="1600" height="900" tabindex="0" aria-label="Cell Brawlers game canvas"></canvas>
  <section id="loading" aria-live="polite"><div class="loading-card"><div class="loading-title">CELL BRAWLERS</div><div class="loading-line"><span></span></div><p>Preparing the cytoplasm…</p></div></section>
  <section id="touch-controls" aria-hidden="true">
    <div class="touch-pad movement">
      <button data-key="ArrowLeft" aria-label="Move left">◀</button><button data-key="ArrowUp" aria-label="Move up">▲</button><button data-key="ArrowDown" aria-label="Move down">▼</button><button data-key="ArrowRight" aria-label="Move right">▶</button>
    </div>
    <div class="touch-pad actions">
      <button data-key="KeyJ" class="light" aria-label="Light attack">J</button><button data-key="KeyK" class="heavy" aria-label="Heavy attack">K</button><button data-key="KeyL" class="special" aria-label="Special attack">L</button><button data-key="Space" class="dash" aria-label="Dash">⤴</button>
    </div>
  </section>
</main>
<aside id="help"><strong>Controls</strong><span>Move: WASD / arrows</span><span>Light: J</span><span>Heavy: K</span><span>Special: L</span><span>Dash: Space</span><span>Pause: P</span></aside>
<script>(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // CELL BRAWLERS — playable browser prototype
  // No external libraries are required. All in-game art is rendered on Canvas.
  // ---------------------------------------------------------------------------

  const W = 1600;
  const H = 900;
  const TAU = Math.PI * 2;
  const WORLD_W = 4300;
  const LANE_TOP = 505;
  const LANE_BOTTOM = 760;
  const FLOOR_Y = 782;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const loading = document.getElementById('loading');

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const rand = (a, b) => a + Math.random() * (b - a);
  const choose = (arr) => arr[(Math.random() * arr.length) | 0];
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function roundedRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function rgba(hex, alpha) {
    const value = hex.replace('#', '');
    const n = parseInt(value.length === 3
      ? value.split('').map(ch => ch + ch).join('')
      : value, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }

  function withShadow(c, color, blur, fn) {
    c.save();
    c.shadowColor = color;
    c.shadowBlur = blur;
    fn();
    c.restore();
  }

  function worldToScreenX(game, x) {
    return x - game.cameraX;
  }

  class Input {
    constructor() {
      this.held = new Set();
      this.pressed = new Set();
      this.released = new Set();

      const blocked = new Set([
        'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
        'Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD',
        'KeyJ', 'KeyK', 'KeyL', 'Enter', 'Escape', 'KeyP'
      ]);

      window.addEventListener('keydown', (e) => {
        if (blocked.has(e.code)) e.preventDefault();
        if (!this.held.has(e.code)) this.pressed.add(e.code);
        this.held.add(e.code);
      }, { passive: false });

      window.addEventListener('keyup', (e) => {
        if (blocked.has(e.code)) e.preventDefault();
        this.held.delete(e.code);
        this.released.add(e.code);
      }, { passive: false });

      window.addEventListener('blur', () => {
        this.held.clear();
        this.pressed.clear();
        this.released.clear();
      });

      document.querySelectorAll('#touch-controls button').forEach((button) => {
        const code = button.dataset.key;
        const down = (e) => {
          e.preventDefault();
          if (!this.held.has(code)) this.pressed.add(code);
          this.held.add(code);
          button.classList.add('active');
        };
        const up = (e) => {
          e.preventDefault();
          this.held.delete(code);
          this.released.add(code);
          button.classList.remove('active');
        };
        button.addEventListener('pointerdown', down);
        button.addEventListener('pointerup', up);
        button.addEventListener('pointercancel', up);
        button.addEventListener('pointerleave', up);
      });
    }

    isDown(...codes) {
      return codes.some(code => this.held.has(code));
    }

    wasPressed(...codes) {
      return codes.some(code => this.pressed.has(code));
    }

    consume(...codes) {
      let hit = false;
      for (const code of codes) {
        if (this.pressed.has(code)) {
          this.pressed.delete(code);
          hit = true;
        }
      }
      return hit;
    }

    endFrame() {
      this.pressed.clear();
      this.released.clear();
    }
  }

  class SoundSystem {
    constructor() {
      this.ctx = null;
      this.enabled = true;
    }

    unlock() {
      if (!this.enabled) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx?.state === 'suspended') this.ctx.resume().catch(() => {});
    }

    tone(freq, duration = 0.08, type = 'sine', volume = 0.045, slide = 0) {
      if (!this.ctx || !this.enabled) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + duration);
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    hit(power = 1) {
      this.tone(115 + Math.random() * 35, 0.07 + power * 0.018, 'square', 0.025 + power * 0.008, -45);
    }

    whoosh() {
      this.tone(360, 0.11, 'sawtooth', 0.026, -230);
    }

    special(kind) {
      if (kind === 'mito') {
        this.tone(120, 0.35, 'sawtooth', 0.05, 360);
        setTimeout(() => this.tone(420, 0.18, 'square', 0.028, -120), 70);
      } else {
        this.tone(520, 0.28, 'sine', 0.045, 240);
        setTimeout(() => this.tone(760, 0.18, 'sine', 0.03, -240), 55);
      }
    }

    fusion() {
      this.tone(90, 0.45, 'sawtooth', 0.045, 260);
    }
  }

  let NEXT_ID = 1;

  class Particle {
    constructor(x, y, options = {}) {
      this.x = x;
      this.y = y;
      this.vx = options.vx ?? rand(-80, 80);
      this.vy = options.vy ?? rand(-100, -10);
      this.gravity = options.gravity ?? 180;
      this.life = options.life ?? rand(0.25, 0.7);
      this.maxLife = this.life;
      this.size = options.size ?? rand(3, 9);
      this.color = options.color ?? '#ffffff';
      this.glow = options.glow ?? 8;
      this.shape = options.shape ?? 'circle';
      this.drag = options.drag ?? 0.98;
      this.front = options.front ?? true;
      this.rotation = rand(0, TAU);
      this.spin = rand(-5, 5);
    }

    update(dt) {
      this.life -= dt;
      this.vy += this.gravity * dt;
      this.vx *= Math.pow(this.drag, dt * 60);
      this.vy *= Math.pow(this.drag, dt * 60);
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rotation += this.spin * dt;
      return this.life > 0;
    }

    draw(c) {
      const a = clamp(this.life / this.maxLife, 0, 1);
      c.save();
      c.globalAlpha = a;
      c.translate(this.x, this.y);
      c.rotate(this.rotation);
      c.shadowColor = this.color;
      c.shadowBlur = this.glow;
      c.fillStyle = this.color;
      if (this.shape === 'shard') {
        c.beginPath();
        c.moveTo(-this.size, -this.size * 0.25);
        c.lineTo(this.size, 0);
        c.lineTo(-this.size * 0.5, this.size * 0.3);
        c.closePath();
        c.fill();
      } else if (this.shape === 'ring') {
        c.globalAlpha = a * 0.8;
        c.strokeStyle = this.color;
        c.lineWidth = 2;
        c.beginPath();
        c.arc(0, 0, this.size * (1.5 - a * 0.5), 0, TAU);
        c.stroke();
      } else {
        c.beginPath();
        c.arc(0, 0, this.size * (0.5 + a * 0.5), 0, TAU);
        c.fill();
      }
      c.restore();
    }
  }

  class FloatingText {
    constructor(x, y, text, color = '#ffffff', size = 28) {
      this.x = x;
      this.y = y;
      this.text = text;
      this.color = color;
      this.size = size;
      this.life = 0.8;
      this.maxLife = this.life;
    }

    update(dt) {
      this.life -= dt;
      this.y -= 52 * dt;
      return this.life > 0;
    }

    draw(c) {
      const a = clamp(this.life / this.maxLife, 0, 1);
      c.save();
      c.globalAlpha = a;
      c.font = `900 ${this.size}px system-ui, sans-serif`;
      c.textAlign = 'center';
      c.lineWidth = 7;
      c.strokeStyle = 'rgba(4,4,12,.85)';
      c.strokeText(this.text, this.x, this.y);
      c.fillStyle = this.color;
      c.shadowColor = this.color;
      c.shadowBlur = 12;
      c.fillText(this.text, this.x, this.y);
      c.restore();
    }
  }

  class Projectile {
    constructor(options) {
      Object.assign(this, {
        id: NEXT_ID++,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        radius: 12,
        life: 2,
        damage: 8,
        color: '#d95cff',
        owner: 'enemy',
        kind: 'orb',
        dead: false
      }, options);
      this.maxLife = this.life;
    }

    update(game, dt) {
      this.life -= dt;
      if (this.life <= 0) {
        this.dead = true;
        return;
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      if (this.owner === 'enemy') {
        for (const hero of game.heroes) {
          if (hero.dead || hero.invuln > 0) continue;
          if (Math.hypot(this.x - hero.x, this.y - hero.y) < this.radius + hero.radius * 0.55) {
            hero.takeDamage(game, this.damage, Math.sign(this.vx) * 180, 0, null);
            this.dead = true;
            game.burst(this.x, this.y - 40, this.color, 10, 120);
            break;
          }
        }
      }
    }

    draw(c) {
      const pulse = 0.8 + Math.sin(performance.now() * 0.015 + this.id) * 0.2;
      c.save();
      c.translate(this.x, this.y);
      c.rotate(Math.atan2(this.vy, this.vx));
      c.shadowColor = this.color;
      c.shadowBlur = 22;
      if (this.kind === 'fibril') {
        const g = c.createLinearGradient(-28, 0, 28, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, this.color);
        g.addColorStop(1, '#ffffff');
        c.strokeStyle = g;
        c.lineWidth = 5;
        c.beginPath();
        c.moveTo(-30, 0);
        c.quadraticCurveTo(0, -8, 32, 0);
        c.stroke();
      } else {
        const g = c.createRadialGradient(-4, -4, 2, 0, 0, this.radius * 1.8);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.25, this.color);
        g.addColorStop(1, rgba(this.color, 0));
        c.fillStyle = g;
        c.beginPath();
        c.arc(0, 0, this.radius * 1.8 * pulse, 0, TAU);
        c.fill();
      }
      c.restore();
    }
  }

  class Hero {
    constructor(type, x, y, controlled) {
      this.id = NEXT_ID++;
      this.type = type;
      this.name = type === 'mito' ? 'MITOCHONDRION' : 'PEROXISOME';
      this.controlled = controlled;
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.facing = 1;
      this.radius = type === 'mito' ? 62 : 38;
      this.visualScale = type === 'mito' ? 1 : 0.72;
      this.maxHealth = type === 'mito' ? 220 : 155;
      this.health = this.maxHealth;
      this.maxEnergy = 100;
      this.energy = 70;
      this.speed = type === 'mito' ? 255 : 330;
      this.accel = type === 'mito' ? 13 : 17;
      this.attack = null;
      this.comboStep = 0;
      this.comboWindow = 0;
      this.invuln = 0;
      this.stun = 0;
      this.slow = 0;
      this.dashTimer = 0;
      this.dashCooldown = 0;
      this.dead = false;
      this.downTimer = 0;
      this.flash = 0;
      this.animTime = Math.random() * 10;
      this.aiThink = 0;
      this.target = null;
      this.attached = [];
      this.lastInputAt = 0;
      this.rescueProgress = 0;
    }

    get color() {
      return this.type === 'mito' ? '#ff7a26' : '#58f68a';
    }

    get accent() {
      return this.type === 'mito' ? '#ffcc45' : '#69fff0';
    }

    startAttack(game, kind) {
      if (this.dead || this.stun > 0 || this.attack || this.dashTimer > 0) return;

      let data;
      if (this.type === 'mito') {
        if (kind === 'light') {
          this.comboStep = this.comboWindow > 0 ? (this.comboStep % 3) + 1 : 1;
          const steps = [
            { duration: 0.30, active: [0.09, 0.17], range: 104, damage: 11, knock: 180 },
            { duration: 0.31, active: [0.10, 0.19], range: 112, damage: 12, knock: 205 },
            { duration: 0.42, active: [0.13, 0.27], range: 142, damage: 20, knock: 365 }
          ];
          data = { ...steps[this.comboStep - 1], kind: 'light', color: '#ffb33c', step: this.comboStep };
          this.comboWindow = 0.52;
        } else if (kind === 'heavy') {
          data = { duration: 0.67, active: [0.27, 0.42], range: 175, damage: 31, knock: 470, kind: 'heavy', color: '#ff7932', interrupt: true };
        } else if (kind === 'special' && this.energy >= 38) {
          this.energy -= 38;
          data = { duration: 0.82, active: [0.28, 0.60], range: 285, damage: 36, knock: 520, kind: 'special', color: '#ffd758', aoe: true, interrupt: true };
          game.sound.special('mito');
        }
      } else {
        if (kind === 'light') {
          this.comboStep = this.comboWindow > 0 ? (this.comboStep % 3) + 1 : 1;
          const steps = [
            { duration: 0.22, active: [0.06, 0.13], range: 82, damage: 7, knock: 120 },
            { duration: 0.24, active: [0.07, 0.15], range: 88, damage: 8, knock: 150 },
            { duration: 0.34, active: [0.09, 0.22], range: 105, damage: 13, knock: 245 }
          ];
          data = { ...steps[this.comboStep - 1], kind: 'light', color: '#75ffd1', step: this.comboStep };
          this.comboWindow = 0.48;
        } else if (kind === 'heavy') {
          data = { duration: 0.57, active: [0.19, 0.39], range: 260, damage: 18, knock: 210, kind: 'heavy', color: '#83ff74', tether: true, interrupt: true };
        } else if (kind === 'special' && this.energy >= 34) {
          this.energy -= 34;
          data = { duration: 0.78, active: [0.22, 0.60], range: 300, damage: 28, knock: 335, kind: 'special', color: '#80ff92', aoe: true, cleanse: true, interrupt: true };
          game.sound.special('peroxi');
        }
      }

      if (!data) return;
      this.attack = {
        ...data,
        time: 0,
        hit: new Set(),
        shakeDone: false
      };
      game.sound.whoosh();
    }

    beginDash(game, dx, dy) {
      if (this.dead || this.stun > 0 || this.attack || this.dashCooldown > 0) return;
      if (Math.abs(dx) + Math.abs(dy) < 0.1) dx = this.facing;
      const len = Math.hypot(dx, dy) || 1;
      this.vx = (dx / len) * (this.type === 'mito' ? 720 : 880);
      this.vy = (dy / len) * (this.type === 'mito' ? 360 : 500);
      this.dashTimer = this.type === 'mito' ? 0.19 : 0.24;
      this.dashCooldown = this.type === 'mito' ? 0.62 : 0.48;
      this.invuln = Math.max(this.invuln, this.type === 'peroxi' ? 0.22 : 0.12);
      game.trail(this.x, this.y - this.radius, this.type === 'mito' ? '#ff8a2e' : '#69ffb8', 8);
    }

    shakeOff(game) {
      if (!this.attached.length) return;
      for (const toxin of [...this.attached]) {
        if (!toxin.dead) {
          toxin.detach(game, true);
          toxin.takeDamage(game, this.type === 'mito' ? 22 : 34, this.facing * 380, -80, this);
        }
      }
      this.attached.length = 0;
      game.burst(this.x, this.y - 80, this.color, 18, 230);
    }

    update(game, dt) {
      this.animTime += dt;
      this.invuln = Math.max(0, this.invuln - dt);
      this.flash = Math.max(0, this.flash - dt);
      this.comboWindow = Math.max(0, this.comboWindow - dt);
      this.dashCooldown = Math.max(0, this.dashCooldown - dt);
      this.slow = Math.max(0, this.slow - dt);
      this.energy = clamp(this.energy + (this.dead ? 0 : 5.4) * dt, 0, this.maxEnergy);

      if (this.dead) {
        this.downTimer += dt;
        this.vx *= Math.pow(0.88, dt * 60);
        this.vy *= Math.pow(0.88, dt * 60);
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        return;
      }

      if (this.stun > 0) {
        this.stun -= dt;
        this.vx *= Math.pow(0.9, dt * 60);
        this.vy *= Math.pow(0.9, dt * 60);
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.clampToArena(game);
        return;
      }

      if (this.dashTimer > 0) {
        this.dashTimer -= dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= Math.pow(0.95, dt * 60);
        this.vy *= Math.pow(0.90, dt * 60);
        if (Math.random() < dt * 35) {
          game.particles.push(new Particle(this.x - this.facing * 20, this.y - 55, {
            vx: -this.vx * 0.12 + rand(-40, 40),
            vy: rand(-20, 40),
            gravity: 0,
            life: 0.25,
            size: rand(5, 12),
            color: this.type === 'mito' ? '#ff8d36' : '#68ffbd',
            glow: 15
          }));
        }
        this.clampToArena(game);
        return;
      }

      if (this.attack) {
        this.attack.time += dt;
        const a = this.attack;
        if (a.kind === 'heavy' && this.type === 'mito' && !a.shakeDone && a.time > 0.20) {
          a.shakeDone = true;
          this.shakeOff(game);
        }
        if (a.time >= a.active[0] && a.time <= a.active[1]) {
          game.resolveHeroAttack(this, a);
        }
        if (a.time >= a.duration) {
          this.attack = null;
        }
      }

      if (this.controlled) this.updateControlled(game, dt);
      else this.updateAI(game, dt);

      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.clampToArena(game);
    }

    updateControlled(game, dt) {
      const input = game.input;
      let dx = 0;
      let dy = 0;
      if (input.isDown('ArrowLeft', 'KeyA')) dx -= 1;
      if (input.isDown('ArrowRight', 'KeyD')) dx += 1;
      if (input.isDown('ArrowUp', 'KeyW')) dy -= 1;
      if (input.isDown('ArrowDown', 'KeyS')) dy += 1;

      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      if (dx) this.facing = Math.sign(dx);

      const movementScale = this.attack ? 0.24 : 1;
      const slowScale = this.slow > 0 ? 0.58 : 1;
      const targetVX = dx * this.speed * movementScale * slowScale;
      const targetVY = dy * this.speed * 0.58 * movementScale * slowScale;
      this.vx = lerp(this.vx, targetVX, 1 - Math.exp(-this.accel * dt));
      this.vy = lerp(this.vy, targetVY, 1 - Math.exp(-this.accel * dt));

      if (input.consume('KeyJ', 'KeyZ')) this.startAttack(game, 'light');
      if (input.consume('KeyK', 'KeyX')) this.startAttack(game, 'heavy');
      if (input.consume('KeyL', 'KeyC')) this.startAttack(game, 'special');
      if (input.consume('Space', 'ShiftLeft', 'ShiftRight')) this.beginDash(game, dx, dy);
    }

    updateAI(game, dt) {
      this.aiThink -= dt;
      const controlled = game.player;

      // Rescue a fallen player first.
      if (controlled?.dead) {
        const d = dist(this, controlled);
        if (d > 75) {
          this.moveToward(controlled.x, controlled.y, dt, 0.85);
        } else {
          this.vx *= 0.75;
          this.vy *= 0.75;
          controlled.rescueProgress += dt;
          if (controlled.rescueProgress >= 1.5) game.reviveHero(controlled);
        }
        return;
      }

      // Peroxisome prioritizes removing attached Mitotoxins from Mitochondrion.
      const mito = game.heroes.find(h => h.type === 'mito' && !h.dead);
      if (this.type === 'peroxi' && mito?.attached.length) {
        const d = dist(this, mito);
        if (d > 105) this.moveToward(mito.x, mito.y, dt, 1);
        else this.startAttack(game, this.energy >= 34 && mito.attached.length > 1 ? 'special' : 'light');
        return;
      }

      if (this.aiThink <= 0 || !this.target || this.target.dead) {
        this.target = game.findNearestEnemy(this.x, this.y);
        this.aiThink = rand(0.18, 0.35);
      }

      if (!this.target) {
        const followX = controlled.x - controlled.facing * (this.type === 'peroxi' ? 105 : 145);
        const followY = controlled.y + 45;
        if (Math.hypot(this.x - followX, this.y - followY) > 110) this.moveToward(followX, followY, dt, 0.8);
        else {
          this.vx *= 0.8;
          this.vy *= 0.8;
        }
        return;
      }

      const d = dist(this, this.target);
      const desired = this.type === 'mito' ? 112 : (this.target.kind?.startsWith('aggregate') ? 120 : 82);
      if (d > desired) {
        this.moveToward(this.target.x, this.target.y, dt, 0.88);
      } else {
        this.facing = Math.sign(this.target.x - this.x) || this.facing;
        this.vx *= 0.72;
        this.vy *= 0.72;
        const nearby = game.enemies.filter(e => !e.dead && Math.hypot(e.x - this.x, e.y - this.y) < 250).length;
        if (nearby >= 4 && this.energy >= 38) this.startAttack(game, 'special');
        else if (this.type === 'peroxi' && this.target.mergeTarget && this.energy >= 34) this.startAttack(game, 'special');
        else if (Math.random() < 0.028) this.startAttack(game, 'heavy');
        else this.startAttack(game, 'light');
      }
    }

    moveToward(x, y, dt, scale = 1) {
      const dx = x - this.x;
      const dy = y - this.y;
      const len = Math.hypot(dx, dy) || 1;
      this.facing = Math.sign(dx) || this.facing;
      const slowScale = this.slow > 0 ? 0.58 : 1;
      this.vx = lerp(this.vx, dx / len * this.speed * scale * slowScale, 1 - Math.exp(-this.accel * dt));
      this.vy = lerp(this.vy, dy / len * this.speed * 0.58 * scale * slowScale, 1 - Math.exp(-this.accel * dt));
    }

    clampToArena(game) {
      const left = game.arenaLeft + 40;
      const right = game.arenaRight - 40;
      this.x = clamp(this.x, left, right);
      this.y = clamp(this.y, LANE_TOP, LANE_BOTTOM);
    }

    takeDamage(game, amount, knockX = 0, knockY = 0, source = null) {
      if (this.dead || this.invuln > 0) return false;
      this.health -= amount;
      this.invuln = 0.26;
      this.flash = 0.12;
      this.stun = Math.max(this.stun, 0.14);
      this.vx += knockX;
      this.vy += knockY;
      game.shake = Math.max(game.shake, amount > 18 ? 10 : 5);
      game.hitStop = Math.max(game.hitStop, amount > 20 ? 0.055 : 0.025);
      game.burst(this.x, this.y - this.radius, '#ff4f83', amount > 20 ? 18 : 10, 190);
      game.floating.push(new FloatingText(this.x, this.y - 120, `-${Math.ceil(amount)}`, '#ff688b', 24));
      game.sound.hit(amount / 16);

      if (this.health <= 0) {
        this.health = 0;
        this.dead = true;
        this.downTimer = 0;
        this.attack = null;
        this.shakeOff(game);
        this.vx = knockX * 0.65;
        this.vy = knockY * 0.65;
        game.announce(`${this.name} DOWN`, '#ff557d', 1.6);
      }
      return true;
    }
  }

  class Enemy {
    constructor(kind, x, y, arenaTag = 0) {
      this.id = NEXT_ID++;
      this.kind = kind;
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.facing = -1;
      this.dead = false;
      this.remove = false;
      this.flash = 0;
      this.invuln = 0;
      this.stun = 0;
      this.attack = null;
      this.cooldown = rand(0.25, 1.1);
      this.animTime = rand(0, 10);
      this.target = null;
      this.arenaTag = arenaTag;
      this.attachedTo = null;
      this.mergeTarget = null;
      this.mergeProgress = 0;
      this.mergeCooldown = rand(0, 1.1);
      this.summonCooldown = 5.5;
      this.specialCooldown = rand(2, 4);
      this.configure(kind);
    }

    configure(kind) {
      if (kind === 'mitotoxin') {
        Object.assign(this, {
          label: 'MITOTOXIN', radius: 33, speed: 175,
          maxHealth: 38, health: 38, color: '#a64bff', score: 140,
          tier: 0
        });
      } else if (kind === 'aggregate-small') {
        Object.assign(this, {
          label: 'SMALL AGGREGATE', radius: 29, speed: 95,
          maxHealth: 32, health: 32, color: '#f04dcb', score: 95,
          tier: 1
        });
      } else if (kind === 'aggregate-medium') {
        Object.assign(this, {
          label: 'MEDIUM AGGREGATE', radius: 58, speed: 72,
          maxHealth: 112, health: 112, color: '#f14bbf', score: 360,
          tier: 2
        });
      } else if (kind === 'aggregate-fused') {
        Object.assign(this, {
          label: 'FUSED AGGREGATE', radius: 105, speed: 52,
          maxHealth: 285, health: 285, color: '#ff3e9d', score: 1100,
          tier: 3
        });
      } else if (kind === 'pore-former') {
        Object.assign(this, {
          label: 'PORE FORMER', radius: 118, speed: 92,
          maxHealth: 620, health: 620, color: '#6edcff', score: 4000,
          tier: 4, boss: true
        });
      }
    }

    canMerge() {
      return !this.dead && !this.attachedTo && this.mergeCooldown <= 0 &&
        (this.kind === 'aggregate-small' || this.kind === 'aggregate-medium');
    }

    breakMerge() {
      const other = this.mergeTarget;
      this.mergeTarget = null;
      this.mergeProgress = 0;
      this.mergeCooldown = 1.75;
      if (other && other.mergeTarget === this) {
        other.mergeTarget = null;
        other.mergeProgress = 0;
        other.mergeCooldown = 1.75;
      }
    }

    detach(game, forced = false) {
      if (!this.attachedTo) return;
      const host = this.attachedTo;
      host.attached = host.attached.filter(e => e !== this);
      this.attachedTo = null;
      this.cooldown = forced ? 1.0 : 0.6;
      this.stun = forced ? 0.45 : 0.2;
      this.x = host.x - host.facing * 70;
      this.y = host.y - 30;
      this.vx = -host.facing * rand(220, 360);
      this.vy = rand(-80, 80);
    }

    update(game, dt) {
      this.animTime += dt;
      this.flash = Math.max(0, this.flash - dt);
      this.invuln = Math.max(0, this.invuln - dt);
      this.cooldown = Math.max(0, this.cooldown - dt);
      this.mergeCooldown = Math.max(0, this.mergeCooldown - dt);
      this.specialCooldown = Math.max(0, this.specialCooldown - dt);

      if (this.dead) {
        this.vx *= Math.pow(0.89, dt * 60);
        this.vy *= Math.pow(0.89, dt * 60);
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        return;
      }

      if (this.attachedTo) {
        const host = this.attachedTo;
        if (host.dead) {
          this.detach(game, false);
          return;
        }
        const side = host.attached.indexOf(this) % 2 ? 1 : -1;
        this.x = host.x + side * (host.type === 'mito' ? 34 : 18);
        this.y = host.y - (host.type === 'mito' ? 112 : 58) - host.attached.indexOf(this) * 12;
        host.energy = Math.max(0, host.energy - 8.5 * dt);
        host.health = Math.max(0, host.health - 1.3 * dt);
        host.slow = Math.max(host.slow, 0.15);
        if (Math.random() < dt * 20) {
          game.particles.push(new Particle(this.x, this.y, {
            vx: rand(-35, 35), vy: rand(-40, 20), gravity: 0,
            life: rand(0.25, 0.55), size: rand(3, 7), color: '#c855ff', glow: 14
          }));
        }
        if (host.health <= 0 && !host.dead) host.takeDamage(game, 1, 0, 0, this);
        return;
      }

      if (this.stun > 0) {
        this.stun -= dt;
        this.vx *= Math.pow(0.90, dt * 60);
        this.vy *= Math.pow(0.90, dt * 60);
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.clampToArena(game);
        return;
      }

      if (this.mergeTarget) {
        if (this.mergeTarget.dead || this.mergeTarget.remove || this.mergeTarget.kind !== this.kind) {
          this.breakMerge();
        } else {
          this.updateMerge(game, dt);
          return;
        }
      }

      if (this.attack) {
        this.updateAttack(game, dt);
        return;
      }

      this.target = this.pickTarget(game);
      if (!this.target) return;
      this.facing = Math.sign(this.target.x - this.x) || this.facing;

      if (this.kind === 'mitotoxin') this.updateMitotoxin(game, dt);
      else if (this.kind.startsWith('aggregate')) this.updateAggregate(game, dt);
      else if (this.kind === 'pore-former') this.updateBoss(game, dt);

      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.clampToArena(game);
    }

    updateMerge(game, dt) {
      const other = this.mergeTarget;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const d = Math.hypot(dx, dy) || 1;
      const reach = (this.radius + other.radius) * 0.72;
      this.vx = lerp(this.vx, dx / d * this.speed * 1.18, 1 - Math.exp(-8 * dt));
      this.vy = lerp(this.vy, dy / d * this.speed * 0.8, 1 - Math.exp(-8 * dt));
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.clampToArena(game);

      const midX = (this.x + other.x) / 2;
      const midY = (this.y + other.y) / 2;
      game.fusionWarning = true;
      game.fusionPoint.x = midX;
      game.fusionPoint.y = midY;

      if (Math.random() < dt * 35) {
        game.particles.push(new Particle(midX + rand(-30, 30), midY - 30 + rand(-20, 20), {
          vx: rand(-25, 25), vy: rand(-60, 20), gravity: 0,
          life: rand(0.25, 0.5), size: rand(3, 8), color: '#ff4dd2', glow: 18
        }));
      }

      if (d < reach) {
        this.mergeProgress += dt;
        other.mergeProgress = this.mergeProgress;
        if (this.mergeProgress >= (this.kind === 'aggregate-small' ? 1.35 : 1.85)) {
          game.mergeEnemies(this, other);
        }
      } else {
        this.mergeProgress = Math.max(0, this.mergeProgress - dt * 0.35);
        other.mergeProgress = this.mergeProgress;
      }
    }

    updateMitotoxin(game, dt) {
      const d = dist(this, this.target);
      if (d > 105) {
        this.moveToward(this.target.x, this.target.y, dt, 1.15);
      } else {
        this.vx *= 0.72;
        this.vy *= 0.72;
        if (this.cooldown <= 0) {
          this.attack = { kind: 'latch', time: 0, duration: 0.58, target: this.target, hit: false };
          this.cooldown = rand(1.1, 1.7);
        }
      }
    }

    updateAggregate(game, dt) {
      const d = dist(this, this.target);
      const range = this.kind === 'aggregate-small' ? 68 : this.kind === 'aggregate-medium' ? 115 : 175;
      if (d > range) {
        this.moveToward(this.target.x, this.target.y, dt, 1);
      } else {
        this.vx *= 0.70;
        this.vy *= 0.70;
        if (this.cooldown <= 0) {
          if (this.kind === 'aggregate-small') {
            this.attack = { kind: 'clump-jab', time: 0, duration: 0.48, target: this.target, hit: false };
            this.cooldown = rand(0.9, 1.4);
          } else if (this.kind === 'aggregate-medium') {
            this.attack = { kind: 'entangle', time: 0, duration: 0.78, target: this.target, hit: false };
            this.cooldown = rand(1.5, 2.2);
          } else {
            this.attack = { kind: 'smash', time: 0, duration: 1.05, target: this.target, hit: false };
            this.cooldown = rand(2.0, 2.8);
          }
        }
      }
    }

    updateBoss(game, dt) {
      this.summonCooldown -= dt;
      const healthRatio = this.health / this.maxHealth;
      const d = dist(this, this.target);

      if (this.summonCooldown <= 0) {
        this.summonCooldown = healthRatio < 0.45 ? 4.2 : 6.4;
        const count = healthRatio < 0.45 ? 3 : 2;
        for (let i = 0; i < count; i++) {
          const toxin = new Enemy('mitotoxin', this.x + rand(-100, 100), clamp(this.y + rand(-110, 110), LANE_TOP, LANE_BOTTOM), this.arenaTag);
          toxin.cooldown = 0.7;
          game.enemies.push(toxin);
          game.burst(toxin.x, toxin.y - 40, '#7b6cff', 10, 120);
        }
        game.announce('MITOTOXINS RELEASED', '#8ee9ff', 1.15);
      }

      if (d > 175) {
        this.moveToward(this.target.x, this.target.y, dt, healthRatio < 0.45 ? 1.2 : 0.92);
      } else if (this.cooldown <= 0) {
        const kind = this.specialCooldown <= 0 ? 'pore-burst' : 'blade-spin';
        this.attack = { kind, time: 0, duration: kind === 'pore-burst' ? 1.35 : 0.92, target: this.target, hit: false };
        this.cooldown = kind === 'pore-burst' ? 2.4 : 1.45;
        if (kind === 'pore-burst') this.specialCooldown = 5.2;
      }
    }

    updateAttack(game, dt) {
      const a = this.attack;
      a.time += dt;
      const t = a.time / a.duration;

      if (a.kind === 'latch') {
        if (a.time < 0.18) {
          this.vx *= 0.75;
          this.vy *= 0.75;
        } else if (a.time < 0.46) {
          const target = a.target;
          const dx = target.x - this.x;
          const dy = target.y - this.y;
          const len = Math.hypot(dx, dy) || 1;
          this.vx = dx / len * 540;
          this.vy = dy / len * 360;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          if (!a.hit && !target.dead && Math.hypot(dx, dy) < this.radius + target.radius * 0.7) {
            a.hit = true;
            if (target.type === 'mito' && target.attached.length < 3) {
              this.attachedTo = target;
              target.attached.push(this);
              this.vx = this.vy = 0;
              game.announce('MITOTOXIN ATTACHED — HEAVY ATTACK TO SHAKE OFF', '#d58cff', 1.8);
            } else {
              target.takeDamage(game, 8, this.facing * 180, 0, this);
            }
          }
        }
      } else if (a.kind === 'clump-jab') {
        if (!a.hit && a.time > 0.22) {
          a.hit = true;
          if (dist(this, a.target) < 90) {
            a.target.takeDamage(game, 7, this.facing * 150, 0, this);
            a.target.slow = Math.max(a.target.slow, 0.8);
          }
        }
      } else if (a.kind === 'entangle') {
        if (!a.hit && a.time > 0.34) {
          a.hit = true;
          for (const hero of game.heroes) {
            if (!hero.dead && Math.hypot(hero.x - this.x, hero.y - this.y) < 160) {
              hero.takeDamage(game, 13, this.facing * 210, 0, this);
              hero.slow = Math.max(hero.slow, 1.7);
            }
          }
          for (let i = 0; i < 16; i++) {
            game.particles.push(new Particle(this.x, this.y - 45, {
              vx: rand(-280, 280), vy: rand(-110, 80), gravity: 80,
              life: rand(0.3, 0.65), size: rand(3, 8), color: '#ff55d5', glow: 13,
              shape: i % 3 === 0 ? 'shard' : 'circle'
            }));
          }
        }
      } else if (a.kind === 'smash') {
        if (!a.hit && a.time > 0.54) {
          a.hit = true;
          game.shake = Math.max(game.shake, 16);
          for (const hero of game.heroes) {
            if (!hero.dead && Math.hypot(hero.x - this.x, hero.y - this.y) < 220) {
              hero.takeDamage(game, 25, Math.sign(hero.x - this.x) * 390, 40, this);
            }
          }
          game.burst(this.x, this.y, '#ff43b8', 30, 360);
        }
      } else if (a.kind === 'blade-spin') {
        if (!a.hit && a.time > 0.35) {
          a.hit = true;
          for (const hero of game.heroes) {
            if (!hero.dead && Math.hypot(hero.x - this.x, hero.y - this.y) < 205) {
              hero.takeDamage(game, 21, Math.sign(hero.x - this.x) * 350, rand(-40, 40), this);
            }
          }
          game.burst(this.x, this.y - 55, '#7ce7ff', 24, 300);
        }
      } else if (a.kind === 'pore-burst') {
        if (a.time > 0.45 && !a.projectiles) {
          a.projectiles = true;
          const count = this.health / this.maxHealth < 0.45 ? 12 : 8;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * TAU;
            game.projectiles.push(new Projectile({
              x: this.x, y: this.y - 55,
              vx: Math.cos(angle) * 320,
              vy: Math.sin(angle) * 210,
              radius: 13, damage: 11,
              life: 2.1, color: i % 2 ? '#7ce7ff' : '#bd5fff', kind: 'fibril'
            }));
          }
          game.shake = Math.max(game.shake, 13);
        }
      }

      if (a.time >= a.duration) this.attack = null;
    }

    pickTarget(game) {
      const alive = game.heroes.filter(h => !h.dead);
      if (!alive.length) return null;
      if (this.kind === 'mitotoxin') {
        return alive.find(h => h.type === 'mito') ?? alive[0];
      }
      return alive.reduce((best, h) => dist(this, h) < dist(this, best) ? h : best, alive[0]);
    }

    moveToward(x, y, dt, scale = 1) {
      const dx = x - this.x;
      const dy = y - this.y;
      const len = Math.hypot(dx, dy) || 1;
      this.facing = Math.sign(dx) || this.facing;
      this.vx = lerp(this.vx, dx / len * this.speed * scale, 1 - Math.exp(-7 * dt));
      this.vy = lerp(this.vy, dy / len * this.speed * 0.62 * scale, 1 - Math.exp(-7 * dt));
    }

    clampToArena(game) {
      this.x = clamp(this.x, game.arenaLeft + 25, game.arenaRight - 25);
      this.y = clamp(this.y, LANE_TOP, LANE_BOTTOM);
    }

    takeDamage(game, amount, knockX = 0, knockY = 0, source = null) {
      if (this.dead || this.invuln > 0) return false;
      this.breakMerge();
      this.health -= amount;
      this.invuln = this.boss ? 0.10 : 0.16;
      this.flash = 0.12;
      this.stun = Math.max(this.stun, this.boss ? 0.08 : amount > 20 ? 0.25 : 0.13);
      this.vx += knockX / (this.boss ? 4 : this.tier >= 3 ? 2.2 : 1);
      this.vy += knockY / (this.boss ? 4 : 1);
      game.shake = Math.max(game.shake, amount > 22 ? 11 : 5);
      game.hitStop = Math.max(game.hitStop, amount > 24 ? 0.055 : 0.026);
      game.burst(this.x, this.y - this.radius * 0.55, this.color, amount > 20 ? 17 : 10, 210);
      game.floating.push(new FloatingText(this.x, this.y - this.radius - 35, `${Math.ceil(amount)}`, '#fff3a1', 24));
      game.sound.hit(amount / 15);

      if (this.health <= 0) {
        this.health = 0;
        this.dead = true;
        this.detach(game, false);
        this.breakMerge();
        this.vx = knockX * 0.65;
        this.vy = knockY * 0.65;
        game.score += this.score;
        game.comboHit(this.x, this.y - this.radius);
        game.burst(this.x, this.y - this.radius * 0.3, this.color, this.boss ? 70 : this.tier >= 3 ? 40 : 20, this.boss ? 520 : 320);
        if (this.boss) game.announce('PORE FORMER DISRUPTED', '#8efff4', 2.0);
      } else {
        game.comboHit(this.x, this.y - this.radius);
      }
      return true;
    }
  }

    seedBackground() {
      for (let i = 0; i < 42; i++) {
        this.vesicles.push({
          x: rand(-100, WORLD_W + 100),
          y: rand(110, 510),
          r: rand(12, 48),
          phase: rand(0, TAU),
          speed: rand(0.18, 0.6),
          depth: rand(0.12, 0.7),
          hue: choose([190, 210, 275, 315, 34])
        });
      }
      for (let i = 0; i < 95; i++) {
        this.backgroundMotes.push({
          x: rand(0, WORLD_W),
          y: rand(80, 770),
          size: rand(1, 4),
          phase: rand(0, TAU),
          depth: rand(0.2, 1)
        });
      }
    }

    installPointerControls() {
      canvas.addEventListener('pointerdown', (e) => {
        this.sound.unlock();
        canvas.focus();
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * W / rect.width;
        const y = (e.clientY - rect.top) * H / rect.height;
        if (this.state === 'title') {
          this.state = 'select';
        } else if (this.state === 'select') {
          if (y > 205 && y < 720) {
            this.selection = x < W / 2 ? 0 : 1;
            this.startGame(this.selection === 0 ? 'mito' : 'peroxi');
          }
        } else if (this.state === 'victory' || this.state === 'gameover') {
          this.state = 'select';
        }
      });
    }

    startGame(type) {
      NEXT_ID = 1;
      this.state = 'playing';
      this.time = 0;
      this.score = 0;
      this.combo = 0;
      this.comboTimer = 0;
      this.maxCombo = 0;
      this.cameraX = 0;
      this.cameraTarget = 0;
      this.shake = 0;
      this.hitStop = 0;
      this.message = '';
      this.messageTimer = 0;
      this.helpTimer = 8.5;
      this.fusionWarning = false;
      this.wave0Spawned = true;
      this.wave1Spawned = false;
      this.bossSpawned = false;
      this.wave0Clear = false;
      this.wave1Clear = false;
      this.victoryTimer = 0;
      this.arenaLeft = 180;
      this.arenaRight = 1450;
      this.particles.length = 0;
      this.floating.length = 0;
      this.projectiles.length = 0;
      this.enemies.length = 0;

      this.player = new Hero(type, 460, 650, true);
      this.partner = new Hero(type === 'mito' ? 'peroxi' : 'mito', 330, 705, false);
      this.heroes = [this.player, this.partner];

      this.spawnWave0();
      this.announce('CYTOSKELETON HIGHWAY — CLEAR THE MITOTOXINS', '#c5efff', 2.4);
    }

    spawnWave0() {
      const points = [
        [1030, 580], [1220, 690], [1320, 540], [1130, 745]
      ];
      for (const [x, y] of points) this.enemies.push(new Enemy('mitotoxin', x, y, 0));
    }

    spawnWave1() {
      this.wave1Spawned = true;
      this.arenaLeft = 1520;
      this.arenaRight = 2880;
      const smalls = [
        [2150, 560], [2230, 680], [2370, 610], [2470, 720], [2600, 545], [2700, 690]
      ];
      for (const [x, y] of smalls) {
        const a = new Enemy('aggregate-small', x, y, 1);
        a.mergeCooldown = rand(0.2, 1.2);
        this.enemies.push(a);
      }
      this.enemies.push(new Enemy('mitotoxin', 2300, 740, 1));
      this.enemies.push(new Enemy('mitotoxin', 2680, 590, 1));
      this.announce('PROTEIN SPILL — STOP AGGREGATE FUSION', '#ff72d3', 2.3);
    }

    spawnBoss() {
      this.bossSpawned = true;
      this.arenaLeft = 2900;
      this.arenaRight = WORLD_W - 170;
      const boss = new Enemy('pore-former', 3840, 625, 2);
      boss.cooldown = 1.1;
      this.enemies.push(boss);
      this.enemies.push(new Enemy('aggregate-small', 3500, 535, 2));
      this.enemies.push(new Enemy('aggregate-small', 3620, 720, 2));
      this.announce('BOSS: PORE FORMER', '#7ce7ff', 2.2);
    }

    announce(text, color = '#ffffff', duration = 1.4) {
      this.message = text;
      this.messageColor = color;
      this.messageTimer = duration;
    }

    reviveHero(hero) {
      hero.dead = false;
      hero.health = hero.maxHealth * 0.42;
      hero.energy = 42;
      hero.invuln = 1.5;
      hero.stun = 0;
      hero.rescueProgress = 0;
      hero.downTimer = 0;
      this.burst(hero.x, hero.y - 55, hero.color, 32, 280);
      this.announce(`${hero.name} RESTORED`, hero.color, 1.4);
    }

    update(dt) {
      this.time += dt;
      this.messageTimer = Math.max(0, this.messageTimer - dt);
      this.comboTimer = Math.max(0, this.comboTimer - dt);
      this.helpTimer = Math.max(0, this.helpTimer - dt);
      if (this.comboTimer <= 0) this.combo = 0;

      if (this.input.wasPressed('KeyM')) this.sound.enabled = !this.sound.enabled;

      if (this.state === 'title') {
        if (this.input.consume('Enter', 'Space')) {
          this.sound.unlock();
          this.state = 'select';
        }
        return;
      }

      if (this.state === 'select') {
        if (this.input.consume('ArrowLeft', 'KeyA')) this.selection = 0;
        if (this.input.consume('ArrowRight', 'KeyD')) this.selection = 1;
        if (this.input.consume('Enter', 'Space', 'KeyJ')) {
          this.sound.unlock();
          this.startGame(this.selection === 0 ? 'mito' : 'peroxi');
        }
        if (this.input.consume('Escape')) this.state = 'title';
        return;
      }

      if (this.state === 'paused') {
        if (this.input.consume('KeyP', 'Escape')) this.state = 'playing';
        return;
      }

      if (this.state === 'victory' || this.state === 'gameover') {
        if (this.input.consume('Enter', 'Space', 'KeyR')) this.state = 'select';
        return;
      }

      if (this.input.consume('KeyP', 'Escape')) {
        this.state = 'paused';
        return;
      }

      this.fusionWarning = false;
      this.assignMergePairs();

      for (const hero of this.heroes) hero.update(this, dt);
      for (const enemy of [...this.enemies]) enemy.update(this, dt);
      for (const projectile of this.projectiles) projectile.update(this, dt);

      this.separateBodies();
      this.updateStage(dt);
      this.updateEffects(dt);
      this.updateCamera(dt);

      this.enemies = this.enemies.filter(e => {
        if (!e.dead) return true;
        e.removeTimer = (e.removeTimer ?? 0) + dt;
        return e.removeTimer < (e.boss ? 1.5 : 0.72);
      });
      this.projectiles = this.projectiles.filter(p => !p.dead);

      if (this.heroes.every(h => h.dead)) {
        this.victoryTimer += dt;
        if (this.victoryTimer > 1.3) this.state = 'gameover';
      }
    }

    assignMergePairs() {
      const candidates = this.enemies.filter(e => e.canMerge() && !e.mergeTarget);
      for (const a of candidates) {
        if (a.mergeTarget || a.dead) continue;
        let best = null;
        let bestD = Infinity;
        for (const b of candidates) {
          if (a === b || b.mergeTarget || b.dead || a.kind !== b.kind) continue;
          const d = dist(a, b);
          if (d < bestD && d < (a.kind === 'aggregate-small' ? 330 : 430)) {
            best = b;
            bestD = d;
          }
        }
        if (best && Math.random() < 0.018) {
          a.mergeTarget = best;
          best.mergeTarget = a;
          a.mergeProgress = best.mergeProgress = 0;
        }
      }
    }

    mergeEnemies(a, b) {
      if (a.dead || b.dead || a.remove || b.remove) return;
      const newKind = a.kind === 'aggregate-small' ? 'aggregate-medium' : 'aggregate-fused';
      const x = (a.x + b.x) / 2;
      const y = (a.y + b.y) / 2;
      const merged = new Enemy(newKind, x, y, a.arenaTag);
      merged.health = Math.min(merged.maxHealth, a.health + b.health + (newKind === 'aggregate-medium' ? 30 : 70));
      merged.invuln = 0.55;
      a.remove = b.remove = true;
      a.dead = b.dead = true;
      a.removeTimer = b.removeTimer = 99;
      this.enemies.push(merged);
      this.sound.fusion();
      this.shake = Math.max(this.shake, newKind === 'aggregate-fused' ? 20 : 11);
      this.burst(x, y - merged.radius * 0.4, '#ff47c8', newKind === 'aggregate-fused' ? 55 : 32, newKind === 'aggregate-fused' ? 460 : 320);
      this.announce(newKind === 'aggregate-fused' ? 'FUSED AGGREGATE FORMED!' : 'AGGREGATE FUSION!', '#ff62d6', 1.5);
    }

    resolveHeroAttack(hero, attack) {
      const hitAttached = [];
      for (const enemy of this.enemies) {
        if (enemy.dead || attack.hit.has(enemy.id)) continue;
        const dx = enemy.x - hero.x;
        const dy = enemy.y - hero.y;
        const d = Math.hypot(dx, dy * 1.25);
        const inDirection = attack.aoe || Math.sign(dx || hero.facing) === hero.facing || Math.abs(dx) < 28;
        const range = attack.range + enemy.radius * 0.35;
        if (d > range || !inDirection) continue;

        attack.hit.add(enemy.id);
        const direction = attack.aoe ? Math.sign(dx || hero.facing) : hero.facing;
        let damage = attack.damage;
        if (enemy.boss && attack.kind === 'light') damage *= 0.82;
        const knock = direction * attack.knock;
        enemy.takeDamage(this, damage, knock, dy * 0.9, hero);

        if (attack.tether && !enemy.boss) {
          enemy.vx = -direction * Math.min(360, attack.knock + 100);
          enemy.vy += (hero.y - enemy.y) * 1.8;
          enemy.x -= direction * 14;
          this.drawTetherBurst(hero, enemy);
        }

        if (attack.interrupt) enemy.breakMerge();
        if (enemy.attachedTo) hitAttached.push(enemy);
      }

      // Peroxisome attacks can cleanse toxins attached to nearby mitochondria.
      if (hero.type === 'peroxi') {
        const mito = this.heroes.find(h => h.type === 'mito');
        if (mito && Math.hypot(mito.x - hero.x, mito.y - hero.y) < attack.range + 100) {
          for (const toxin of [...mito.attached]) {
            if (!attack.hit.has(toxin.id)) {
              attack.hit.add(toxin.id);
              toxin.detach(this, true);
              toxin.takeDamage(this, attack.kind === 'special' ? 38 : 18, hero.facing * 300, -60, hero);
            }
          }
        }
      }

      if (attack.kind === 'special' && attack.hit.size && Math.random() < 0.25) {
        this.trail(hero.x, hero.y - hero.radius, attack.color, 12);
      }
    }

    drawTetherBurst(hero, enemy) {
      const steps = 11;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        this.particles.push(new Particle(
          lerp(hero.x, enemy.x, t),
          lerp(hero.y - 55, enemy.y - enemy.radius * 0.5, t) + Math.sin(t * Math.PI) * -25,
          { vx: rand(-25, 25), vy: rand(-25, 25), gravity: 0, life: 0.28, size: 5, color: '#7cff9f', glow: 16 }
        ));
      }
    }

    comboHit(x, y) {
      this.combo = this.comboTimer > 0 ? this.combo + 1 : 1;
      this.comboTimer = 1.35;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      if (this.combo > 1 && this.combo % 5 === 0) {
        this.floating.push(new FloatingText(x, y - 25, `${this.combo} HIT`, '#ffe55c', 32));
      }
      this.score += 10 * this.combo;
    }

    findNearestEnemy(x, y) {
      let best = null;
      let bestD = Infinity;
      for (const e of this.enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - x, (e.y - y) * 1.4);
        if (d < bestD) {
          bestD = d;
          best = e;
        }
      }
      return best;
    }

    separateBodies() {
      const actors = [...this.heroes.filter(h => !h.dead), ...this.enemies.filter(e => !e.dead && !e.attachedTo)];
      for (let i = 0; i < actors.length; i++) {
        for (let j = i + 1; j < actors.length; j++) {
          const a = actors[i];
          const b = actors[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.001;
          const min = (a.radius + b.radius) * 0.43;
          if (d < min) {
            const push = (min - d) * 0.16;
            const nx = dx / d;
            const ny = dy / d;
            if (!a.attachedTo) {
              a.x -= nx * push;
              a.y -= ny * push;
            }
            if (!b.attachedTo) {
              b.x += nx * push;
              b.y += ny * push;
            }
          }
        }
      }
    }

    updateStage(dt) {
      const aliveInArena = (tag) => this.enemies.some(e => !e.dead && e.arenaTag === tag);
      const leadX = Math.max(...this.heroes.map(h => h.x));

      if (!this.wave0Clear && !aliveInArena(0)) {
        this.wave0Clear = true;
        this.arenaRight = 2880;
        this.announce('PATH CLEAR — MOVE RIGHT', '#8effb4', 1.8);
      }

      if (this.wave0Clear && !this.wave1Spawned && leadX > 1670) this.spawnWave1();

      if (this.wave1Spawned && !this.wave1Clear && !aliveInArena(1)) {
        this.wave1Clear = true;
        this.arenaRight = WORLD_W - 170;
        this.announce('CONTACT ZONE OPEN — BOSS AHEAD', '#8eefff', 2.0);
      }

      if (this.wave1Clear && !this.bossSpawned && leadX > 3080) this.spawnBoss();

      if (this.bossSpawned && !aliveInArena(2)) {
        this.victoryTimer += dt;
        if (this.victoryTimer > 1.9) this.state = 'victory';
      } else if (!this.heroes.every(h => h.dead)) {
        this.victoryTimer = 0;
      }
    }

    updateEffects(dt) {
      this.particles = this.particles.filter(p => p.update(dt));
      this.floating = this.floating.filter(f => f.update(dt));
      this.shake = Math.max(0, this.shake - dt * 28);
    }

    updateCamera(dt) {
      if (!this.player) return;
      const averageX = (this.player.x * 0.72 + this.partner.x * 0.28);
      this.cameraTarget = clamp(averageX - W * 0.42, 0, WORLD_W - W);
      this.cameraX = lerp(this.cameraX, this.cameraTarget, 1 - Math.exp(-4.8 * dt));
    }

    burst(x, y, color, count = 12, speed = 180) {
      for (let i = 0; i < count; i++) {
        const angle = rand(0, TAU);
        const s = rand(speed * 0.25, speed);
        this.particles.push(new Particle(x, y, {
          vx: Math.cos(angle) * s,
          vy: Math.sin(angle) * s * 0.72,
          gravity: rand(40, 230),
          life: rand(0.25, 0.7),
          size: rand(2, 8),
          color,
          glow: rand(6, 18),
          shape: Math.random() < 0.25 ? 'shard' : 'circle'
        }));
      }
    }

    trail(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        this.particles.push(new Particle(x + rand(-25, 25), y + rand(-25, 25), {
          vx: rand(-80, 80), vy: rand(-60, 60), gravity: 0,
          life: rand(0.18, 0.4), size: rand(3, 9), color, glow: 14
        }));
      }
    }

    render() {
      ctx.save();
      const sx = this.shake > 0 ? rand(-this.shake, this.shake) : 0;
      const sy = this.shake > 0 ? rand(-this.shake * 0.35, this.shake * 0.35) : 0;
      ctx.translate(sx, sy);

      if (this.state === 'title') this.drawTitle(ctx);
      else if (this.state === 'select') this.drawSelect(ctx);
      else {
        this.drawWorld(ctx);
        this.drawHUD(ctx);
        if (this.state === 'paused') this.drawPause(ctx);
        if (this.state === 'victory') this.drawEndScreen(ctx, true);
        if (this.state === 'gameover') this.drawEndScreen(ctx, false);
      }
      ctx.restore();
    }

    drawTitle(c) {
      c.fillStyle = '#050611';
      c.fillRect(0, 0, W, H);
      if (this.titleImage.complete && this.titleImage.naturalWidth) {
        c.save();
        c.globalAlpha = 0.78;
        c.drawImage(this.titleImage, 0, 0, W, H);
        c.restore();
      }
      const dark = c.createLinearGradient(0, 0, 0, H);
      dark.addColorStop(0, 'rgba(4,5,16,.22)');
      dark.addColorStop(0.55, 'rgba(4,5,16,.12)');
      dark.addColorStop(1, 'rgba(4,5,16,.94)');
      c.fillStyle = dark;
      c.fillRect(0, 0, W, H);

      c.save();
      c.textAlign = 'center';
      c.font = '1000 italic 96px system-ui, sans-serif';
      c.lineWidth = 16;
      c.strokeStyle = 'rgba(3,4,12,.92)';
      c.strokeText('CELL BRAWLERS', W / 2, 175);
      const g = c.createLinearGradient(450, 100, 1140, 220);
      g.addColorStop(0, '#ff8a35');
      g.addColorStop(0.45, '#f6f1ff');
      g.addColorStop(1, '#59e8ff');
      c.fillStyle = g;
      c.shadowColor = '#6e8eff';
      c.shadowBlur = 26;
      c.fillText('CELL BRAWLERS', W / 2, 175);
      c.shadowBlur = 0;
      c.font = '800 24px system-ui, sans-serif';
      c.letterSpacing = '6px';
      c.fillStyle = '#e8ebff';
      c.fillText('THE CYTOPLASMIC BREACH', W / 2, 215);
      c.restore();

      const pulse = 0.7 + Math.sin(this.time * 4) * 0.18;
      roundedRectPath(c, W / 2 - 250, H - 145, 500, 66, 18);
      c.fillStyle = `rgba(6,8,22,${0.72 + pulse * 0.1})`;
      c.fill();
      c.strokeStyle = `rgba(132,226,255,${pulse})`;
      c.lineWidth = 3;
      c.stroke();
      c.textAlign = 'center';
      c.font = '900 25px system-ui, sans-serif';
      c.fillStyle = '#ffffff';
      c.fillText('PRESS ENTER OR CLICK TO START', W / 2, H - 103);
      c.font = '600 16px system-ui, sans-serif';
      c.fillStyle = '#b9c5df';
      c.fillText('Playable prototype • original browser game', W / 2, H - 48);
    }

    drawSelect(c) {
      const bg = c.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#10091a');
      bg.addColorStop(0.5, '#091221');
      bg.addColorStop(1, '#071812');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);
      this.drawCellBackground(c, 0, true);

      c.textAlign = 'center';
      c.font = '1000 italic 60px system-ui, sans-serif';
      c.fillStyle = '#ffffff';
      c.shadowColor = '#778cff';
      c.shadowBlur = 20;
      c.fillText('CHOOSE YOUR ORGANELLE', W / 2, 105);
      c.shadowBlur = 0;
      c.font = '600 19px system-ui, sans-serif';
      c.fillStyle = '#b8c3dd';
      c.fillText('The other hero joins as your AI-controlled partner.', W / 2, 143);

      this.drawSelectionCard(c, 90, 195, 665, 535, 'mito', this.selection === 0);
      this.drawSelectionCard(c, 845, 195, 665, 535, 'peroxi', this.selection === 1);

      c.font = '800 20px system-ui, sans-serif';
      c.fillStyle = '#d9def1';
      c.fillText('←  /  →  TO CHOOSE     •     ENTER TO PLAY', W / 2, 805);
      c.font = '600 15px system-ui, sans-serif';
      c.fillStyle = '#8e98b5';
      c.fillText('You can also click a character card.', W / 2, 839);
    }

    drawSelectionCard(c, x, y, w, h, type, selected) {
      c.save();
      roundedRectPath(c, x, y, w, h, 28);
      const g = c.createLinearGradient(x, y, x + w, y + h);
      if (type === 'mito') {
        g.addColorStop(0, 'rgba(82,19,15,.92)');
        g.addColorStop(1, 'rgba(20,10,20,.92)');
      } else {
        g.addColorStop(0, 'rgba(8,62,50,.92)');
        g.addColorStop(1, 'rgba(7,18,24,.92)');
      }
      c.fillStyle = g;
      c.fill();
      c.lineWidth = selected ? 6 : 2;
      c.strokeStyle = selected ? (type === 'mito' ? '#ff9a3f' : '#72ffab') : 'rgba(255,255,255,.16)';
      c.shadowColor = selected ? c.strokeStyle : 'transparent';
      c.shadowBlur = selected ? 28 : 0;
      c.stroke();
      c.shadowBlur = 0;

      c.save();
      c.translate(x + w * 0.52, y + h * 0.54);
      c.scale(type === 'mito' ? 1.4 : 1.7, type === 'mito' ? 1.4 : 1.7);
      if (type === 'mito') this.drawMito(c, { x: 0, y: 70, facing: 1, animTime: this.time, attack: null, flash: 0, dead: false, health: 1, maxHealth: 1, attached: [] }, false);
      else this.drawPeroxi(c, { x: 0, y: 55, facing: 1, animTime: this.time, attack: null, flash: 0, dead: false, health: 1, maxHealth: 1, attached: [] }, false);
      c.restore();

      c.textAlign = 'left';
      c.font = '1000 italic 34px system-ui, sans-serif';
      c.fillStyle = type === 'mito' ? '#ffb14d' : '#71ffad';
      c.fillText(type === 'mito' ? 'MITOCHONDRION' : 'PEROXISOME', x + 30, y + 52);
      c.font = '700 17px system-ui, sans-serif';
      c.fillStyle = '#d8dced';
      c.fillText(type === 'mito' ? 'POWER FIGHTER' : 'FAST SUPPORT FIGHTER', x + 32, y + 82);

      const facts = type === 'mito'
        ? ['High health and impact', 'Cristae-powered melee attacks', 'Can throw small protein enemies']
        : ['Small, round and highly mobile', 'Detox burst and long tether', 'Removes toxins from Mitochondrion'];
      c.font = '600 16px system-ui, sans-serif';
      c.fillStyle = '#b8c1d9';
      facts.forEach((line, i) => c.fillText(`• ${line}`, x + 32, y + h - 92 + i * 25));

      if (selected) {
        roundedRectPath(c, x + w - 154, y + 22, 124, 39, 12);
        c.fillStyle = type === 'mito' ? '#ff7430' : '#31d978';
        c.fill();
        c.font = '900 15px system-ui, sans-serif';
        c.textAlign = 'center';
        c.fillStyle = '#071017';
        c.fillText('SELECTED', x + w - 92, y + 48);
      }
      c.restore();
    }

    drawWorld(c) {
      this.drawCellBackground(c, this.cameraX, false);

      c.save();
      c.translate(-this.cameraX, 0);
      this.drawStageFloor(c);
      this.drawArenaGates(c);
      this.drawFusionLinks(c);

      const actors = [
        ...this.heroes.map(h => ({ y: h.y, kind: 'hero', entity: h })),
        ...this.enemies.map(e => ({ y: e.y, kind: 'enemy', entity: e }))
      ].sort((a, b) => a.y - b.y);

      for (const actor of actors) {
        if (actor.kind === 'hero') this.drawHero(c, actor.entity);
        else this.drawEnemy(c, actor.entity);
      }

      for (const projectile of this.projectiles) projectile.draw(c);
      for (const particle of this.particles.filter(p => p.front)) particle.draw(c);
      for (const text of this.floating) text.draw(c);
      c.restore();
    }

    drawCellBackground(c, cameraX, selectMode = false) {
      const bg = c.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, selectMode ? '#0a1021' : '#081327');
      bg.addColorStop(0.55, selectMode ? '#160b22' : '#16102b');
      bg.addColorStop(1, '#090813');
      c.fillStyle = bg;
      c.fillRect(0, 0, W, H);

      c.save();
      c.translate(-cameraX * 0.13, 0);
      this.drawER(c, 820, 255, 1.1, '#4663a9');
      this.drawER(c, 2550, 210, 1.28, '#3e5f9e');
      this.drawBackgroundMito(c, 250, 280, 1.22);
      this.drawBackgroundMito(c, 3320, 300, 1.35);
      c.restore();

      c.save();
      for (const v of this.vesicles) {
        const x = v.x - cameraX * v.depth;
        if (x < -100 || x > W + 100) continue;
        const y = v.y + Math.sin(this.time * v.speed + v.phase) * 11;
        const grad = c.createRadialGradient(x - v.r * 0.3, y - v.r * 0.35, 2, x, y, v.r);
        grad.addColorStop(0, `hsla(${v.hue},85%,82%,.30)`);
        grad.addColorStop(0.55, `hsla(${v.hue},70%,55%,.10)`);
        grad.addColorStop(1, `hsla(${v.hue},80%,55%,.02)`);
        c.fillStyle = grad;
        c.strokeStyle = `hsla(${v.hue},90%,80%,.18)`;
        c.lineWidth = 2;
        c.beginPath();
        c.arc(x, y, v.r, 0, TAU);
        c.fill();
        c.stroke();
      }
      c.restore();

      c.save();
      for (const m of this.backgroundMotes) {
        const x = m.x - cameraX * m.depth + Math.sin(this.time * 0.4 + m.phase) * 5;
        if (x < 0 || x > W) continue;
        c.globalAlpha = 0.25 + 0.25 * Math.sin(this.time * 1.2 + m.phase);
        c.fillStyle = m.depth > 0.6 ? '#d9c9ff' : '#70dfff';
        c.beginPath();
        c.arc(x, m.y, m.size, 0, TAU);
        c.fill();
      }
      c.restore();

      const haze = c.createLinearGradient(0, 390, 0, H);
      haze.addColorStop(0, 'rgba(138,98,205,0)');
      haze.addColorStop(1, 'rgba(21,8,39,.55)');
      c.fillStyle = haze;
      c.fillRect(0, 380, W, H - 380);
    }

    drawBackgroundMito(c, x, y, scale) {
      c.save();
      c.translate(x, y);
      c.scale(scale, scale);
      c.globalAlpha = 0.36;
      c.shadowColor = '#ff7e32';
      c.shadowBlur = 35;
      const g = c.createLinearGradient(-170, -100, 170, 100);
      g.addColorStop(0, '#5d191b');
      g.addColorStop(1, '#9a3f23');
      c.fillStyle = g;
      c.strokeStyle = '#ff9b49';
      c.lineWidth = 7;
      c.beginPath();
      c.ellipse(0, 0, 210, 84, -0.14, 0, TAU);
      c.fill();
      c.stroke();
      c.strokeStyle = '#ffd05a';
      c.lineWidth = 10;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        for (let px = -155; px <= 155; px += 8) {
          const py = i * 22 + Math.sin(px * 0.035 + i) * 15;
          if (px === -155) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.stroke();
      }
      c.restore();
    }

    drawER(c, x, y, scale, color) {
      c.save();
      c.translate(x, y);
      c.scale(scale, scale);
      c.globalAlpha = 0.23;
      c.strokeStyle = color;
      c.shadowColor = color;
      c.shadowBlur = 25;
      for (let i = 0; i < 7; i++) {
        c.lineWidth = 24 - i * 1.5;
        c.beginPath();
        c.moveTo(-300, i * 35);
        c.bezierCurveTo(-150, i * 35 - 75, 50, i * 35 + 95, 250, i * 35 - 10);
        c.stroke();
        c.strokeStyle = i % 2 ? '#60499a' : color;
      }
      c.restore();
    }

    drawStageFloor(c) {
      const floor = c.createLinearGradient(0, 430, 0, H);
      floor.addColorStop(0, 'rgba(36,27,60,.15)');
      floor.addColorStop(0.45, 'rgba(36,22,56,.88)');
      floor.addColorStop(1, '#080813');
      c.fillStyle = floor;
      c.fillRect(0, 440, WORLD_W, H - 440);

      c.save();
      c.globalAlpha = 0.5;
      for (let y = 490; y <= 800; y += 38) {
        c.strokeStyle = y % 76 === 0 ? 'rgba(103,197,255,.16)' : 'rgba(175,116,255,.11)';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(WORLD_W, y + Math.sin(y) * 4);
        c.stroke();
      }
      for (let x = 0; x < WORLD_W; x += 86) {
        c.strokeStyle = 'rgba(99,178,255,.08)';
        c.beginPath();
        c.moveTo(x, 470);
        c.lineTo(x + 180, 820);
        c.stroke();
      }
      c.restore();

      // Cytoskeleton rails.
      for (let rail = 0; rail < 3; rail++) {
        const y = 790 + rail * 27;
        c.strokeStyle = rail === 0 ? '#304267' : '#41264f';
        c.lineWidth = 14;
        c.shadowColor = rail === 0 ? '#4ea6ff' : '#cf4bd2';
        c.shadowBlur = 10;
        c.beginPath();
        c.moveTo(0, y);
        for (let x = 0; x < WORLD_W; x += 80) {
          c.lineTo(x, y + Math.sin(x * 0.015 + rail) * 5);
        }
        c.stroke();
      }
      c.shadowBlur = 0;

      // Signs.
      this.drawSign(c, 380, 825, 'CYTOSKELETON HIGHWAY  →');
      this.drawSign(c, 1900, 825, 'CONTACT ZONE  →');
      this.drawSign(c, 3260, 825, 'MITOCHONDRIAL NETWORK');
    }

    drawSign(c, x, y, text) {
      roundedRectPath(c, x, y, 305, 42, 7);
      c.fillStyle = 'rgba(7,11,24,.85)';
      c.fill();
      c.strokeStyle = 'rgba(151,196,255,.18)';
      c.stroke();
      c.font = '800 15px system-ui, sans-serif';
      c.fillStyle = 'rgba(211,225,255,.65)';
      c.textAlign = 'center';
      c.fillText(text, x + 152, y + 27);
    }

    drawArenaGates(c) {
      const gates = [1450, 2880];
      gates.forEach((x, index) => {
        const closed = index === 0 ? !this.wave0Clear : !this.wave1Clear;
        if (!closed) return;
        c.save();
        c.globalAlpha = 0.78;
        c.strokeStyle = index === 0 ? '#8f5dff' : '#ff4fbe';
        c.shadowColor = c.strokeStyle;
        c.shadowBlur = 20;
        c.lineWidth = 7;
        for (let y = 455; y < 810; y += 34) {
          c.beginPath();
          c.moveTo(x - 10, y);
          c.lineTo(x + 10, y + 18);
          c.stroke();
        }
        c.font = '900 16px system-ui, sans-serif';
        c.textAlign = 'center';
        c.fillStyle = '#f6ecff';
        c.fillText('CELLULAR BARRIER', x, 438);
        c.restore();
      });
    }

    drawFusionLinks(c) {
      const drawn = new Set();
      for (const e of this.enemies) {
        const t = e.mergeTarget;
        if (!t || e.dead || t.dead || drawn.has(t.id)) continue;
        drawn.add(e.id);
        c.save();
        const progress = e.mergeProgress / (e.kind === 'aggregate-small' ? 1.35 : 1.85);
        c.strokeStyle = `rgba(255,69,205,${0.36 + progress * 0.62})`;
        c.lineWidth = 4 + progress * 7;
        c.shadowColor = '#ff4fd5';
        c.shadowBlur = 18 + progress * 25;
        c.setLineDash([13, 10]);
        c.lineDashOffset = -this.time * 80;
        c.beginPath();
        c.moveTo(e.x, e.y - e.radius * 0.5);
        c.quadraticCurveTo((e.x + t.x) / 2, Math.min(e.y, t.y) - 90, t.x, t.y - t.radius * 0.5);
        c.stroke();
        c.restore();
      }
    }

    drawHero(c, hero) {
      c.save();
      c.globalAlpha = hero.dead ? 0.55 : 1;
      if (hero.type === 'mito') this.drawMito(c, hero, true);
      else this.drawPeroxi(c, hero, true);
      c.restore();
    }

    drawMito(c, hero, useWorldPosition) {
      const x = useWorldPosition ? hero.x : 0;
      const y = useWorldPosition ? hero.y : hero.y;
      const bob = hero.dead ? 0 : Math.sin(hero.animTime * 7) * (Math.abs(hero.vx) + Math.abs(hero.vy) > 20 ? 4 : 2);
      const attackT = hero.attack ? hero.attack.time / hero.attack.duration : 0;
      const punch = hero.attack ? Math.sin(clamp(attackT, 0, 1) * Math.PI) : 0;
      const heavy = hero.attack?.kind === 'heavy' || hero.attack?.kind === 'special';
      const bodyLean = hero.attack ? hero.facing * punch * 0.08 : hero.vx / 5000;
      const face = hero.facing || 1;

      c.save();
      c.translate(x, y + bob);
      c.scale(face, 1);
      c.rotate(bodyLean);

      // Shadow.
      c.save();
      c.scale(face, 1);
      c.globalAlpha = 0.35;
      c.fillStyle = '#000';
      c.beginPath();
      c.ellipse(0, 8, 70, 18, 0, 0, TAU);
      c.fill();
      c.restore();

      // Back leg.
      this.drawLimb(c, -26, -18, -38, 0, 25, '#6d211e', '#1c1720');
      this.drawBoot(c, -43, 2, -0.06, '#251d23', '#d5512d');

      // Back arm.
      const backPunch = hero.attack && hero.attack.step === 2 ? punch : 0;
      this.drawArm(c, -42, -118, -66 - backPunch * 50, -80, -0.5, '#9b3023', '#251a20');

      // Body capsule.
      c.save();
      c.translate(0, -82);
      const bodyGradient = c.createLinearGradient(-55, -80, 55, 85);
      bodyGradient.addColorStop(0, hero.flash > 0 ? '#ffffff' : '#f0572d');
      bodyGradient.addColorStop(0.5, '#a52b22');
      bodyGradient.addColorStop(1, '#5d171d');
      c.fillStyle = bodyGradient;
      c.strokeStyle = '#34121a';
      c.lineWidth = 7;
      c.beginPath();
      c.moveTo(-29, -82);

    drawPeroxi(c, hero, useWorldPosition) {

      c.fillStyle = g;
      c.strokeStyle = '#0f262a';
      c.lineWidth = 7;
      c.shadowColor = '#57ffa7';

      c.restore();

      // Central crystalline core — deliberately smaller than the organelle.
      c.save();
      c.translate(0, -76);

      c.shadowColor = '#e8ff55';
      c.shadowBlur = 16;
      c.fillStyle = '#dfff64';
      c.strokeStyle = '#6bff8e';
      c.lineWidth = 3;
      c.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + i * TAU / 6;
        const r = i % 2 ? 19 : 24;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath();
      c.fill(); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.75)';
      c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, -22); c.lineTo(-10, 15); c.lineTo(20, 4); c.closePath(); c.stroke();
      c.restore();

      // Eyes.
      c.fillStyle = '#f7fff9';
      c.strokeStyle = '#09242a';
      c.lineWidth = 4;
      c.beginPath();
      c.moveTo(-42, -92);
      c.quadraticCurveTo(-20, -110, -5, -89);
      c.quadraticCurveTo(-21, -72, -43, -79);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath();
      c.moveTo(42, -92);
      c.quadraticCurveTo(20, -110, 5, -89);
      c.quadraticCurveTo(21, -72, 43, -79);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#072b2b';
      c.beginPath(); c.arc(-17, -88, 6, 0, TAU); c.fill();
      c.beginPath(); c.arc(17, -88, 6, 0, TAU); c.fill();

      // Belt.
      c.fillStyle = '#172026';
      roundedRectPath(c, -53, -32, 106, 14, 6);
      c.fill();
      c.fillStyle = '#7bff74';
      c.beginPath(); c.arc(0, -25, 10, 0, TAU); c.fill();

      // Front arm.
      const reach = hero.attack ? (hero.attack.kind === 'heavy' ? 72 : 44) * punch : 0;
      this.drawArm(c, 42, -67, 55 + reach, -45, 0.15, '#209f70', '#172026', 0.73);

      // Bandana ribbons.
      c.strokeStyle = '#138878';
      c.lineWidth = 7;
      c.shadowColor = '#54ffd8';
      c.shadowBlur = 8;
      for (let i = 0; i < 2; i++) {
        c.beginPath();
        c.moveTo(-28, -124 + i * 5);
        c.bezierCurveTo(-62, -142, -77 - hero.vx * 0.04, -115 + i * 12, -103 - hero.vx * 0.06, -132 + i * 18);
        c.stroke();

      c.shadowBlur = 0;

      // Attack effects.
      if (hero.attack) {
        const active = hero.attack.time >= hero.attack.active[0] && hero.attack.time <= hero.attack.active[1];
        if (active || hero.attack.kind === 'special') {
          c.save();
          c.globalCompositeOperation = 'lighter';
          if (hero.attack.tether) {
            c.strokeStyle = '#8dff80';
            c.lineWidth = 9;
            c.shadowColor = '#55ffb0';

          } else {
            c.strokeStyle = '#7dffd4';
            c.lineWidth = 8;
            c.shadowColor = '#62ffac';
            c.shadowBlur = 18;
            c.beginPath(); c.arc(56 + reach * 0.45, -44, 45 * punch + 8, -1.8, 1.25); c.stroke();
